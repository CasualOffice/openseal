[package]
name = "spk02-seal-native"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "SPK-02: PAdES B-B sealing with aws-lc-rs keys and RustCrypto CMS structures."

[dependencies]
aws-lc-rs = "1.19.0"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "crypto", "pem"] }
der.workspace = true
spki.workspace = true
x509-cert.workspace = true
cms.workspace = true
spk02-verify = { path = "../verify", features = ["rsa"] }
