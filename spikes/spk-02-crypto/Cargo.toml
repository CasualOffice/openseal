# SPK-02 crypto-stack spike. Standalone: its own workspace, never published, not part of
# the product workspace. Report: docs/66-SPK-02-CRYPTO-STACK.md.
[workspace]
resolver = "3"
members = ["seal-native", "verify"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# RustCrypto structures (the generation built on der 0.8).
der = { version = "0.8.3", features = ["alloc", "derive", "oid"] }
spki = { version = "0.8.1", features = ["alloc"] }
x509-cert = { version = "0.3.0", default-features = false }
cms = { version = "=0.3.0-rc.2", default-features = false }
sha2 = { version = "0.11.1", default-features = false, features = ["oid"] }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
rsa = { version = "0.10.0", default-features = false, features = ["encoding", "pkcs1v15"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
