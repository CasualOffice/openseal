name: fuzz

# FUZZ-01 (Phase 1 exit item 1): 24 hours per target, cumulative. GitHub caps a job at
# 6 hours, so each run gives every target 5.5 hours and the corpus carries over in the
# cache; five clean runs make 27.5 hours. Runs every 6 hours, one at a time (the
# concurrency group queues the next), so the 24 hours take about 30. Owner instruction 11.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "19800"

concurrency:
  group: fuzz
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NIGHTLY: nightly-2026-08-04

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: admit, seeds: "fixtures/hostile fixtures/signed", dict: pdf.dict }
          - { target: normalize, seeds: "fixtures/hostile fixtures/signed", dict: pdf.dict }
          - { target: content, seeds: "fixtures/hostile", dict: pdf.dict }
          - { target: verify, seeds: "fixtures/sealed fixtures/signed", dict: pdf.dict }
          - { target: verify_chain, seeds: "fuzz/seeds/verify_chain", dict: json.dict }
          - { target: seal, seeds: "fixtures/sealed fixtures/signed", dict: pdf.dict }
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install "$NIGHTLY" --profile minimal
      # Built with stable: a nightly can break its dependencies (rustix), as it did on 2026-11-10.
      - run: cargo +stable install cargo-fuzz --version 0.13.2 --locked
      - name: Restore the corpus from the last run
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz
        run: |
          mkdir -p "fuzz/corpus/${{ matrix.target }}"
          seconds="${{ github.event.inputs.seconds || '19800' }}"
          start=$(date +%s)
          cargo +"$NIGHTLY" fuzz run "${{ matrix.target }}" "fuzz/corpus/${{ matrix.target }}" ${{ matrix.seeds }} -- \
            -max_total_time="$seconds" -dict="fuzz/${{ matrix.dict }}" -print_final_stats=1
          ran=$(( $(date +%s) - start ))
          {
            echo "### ${{ matrix.target }}"
            echo "Fuzzed ${ran} s with no crash; corpus $(ls "fuzz/corpus/${{ matrix.target }}" | wc -l) inputs at ${{ github.sha }}."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the crash
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
