name: pages

# Publish the website, site/, to GitHub Pages (SITE-01). Shaped after OpenCalc's
# .github/workflows/pages.yml at 59742cf (PROVENANCE.md): actions pinned by SHA, the
# pages that must exist asserted rather than assumed. The site is static and committed;
# this job regenerates its generated pages, checks it is complete, drops the sources
# (site/_src/), and deploys. GitHub Pages must be enabled in the repository settings (source: GitHub
# Actions) for the deploy job to succeed; that is the owner's call.

on:
  push:
    branches: [main]
    paths: ["site/**", "tools/build-*.py", "tools/sitelib.py", "tools/check-site-links.py", "docs/06-ROADMAP-AND-DELIVERY.md", "docs/14-EXECUTION-TRACKER.md", "api/openapi.yaml", "CHANGELOG.md", "webapp/tokens.css", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Regenerated here, so the roadmap, API reference and changelog follow docs/06,
      # docs/14, api/openapi.yaml and CHANGELOG.md even when site/ was not rebuilt.
      - name: Build the generated pages
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyyaml==6.0.2
          "$RUNNER_TEMP/venv/bin/python" tools/build-site.py
      - name: Every internal link resolves
        run: python3 -I tools/check-site-links.py
      - name: Assemble the published tree
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R site/. _site/
          rm -rf _site/_src
          touch _site/.nojekyll
          for f in index.html roadmap.html download.html security.html brand.html changelog.html \
                   docs/index.html docs/getting-started.html docs/api.html search-index.json \
                   assets/site.css assets/tokens.css assets/site.js assets/theme-init.js assets/logo.svg \
                   assets/screens/editor-light.webp assets/screens/editor-light.png; do
            [ -s "_site/$f" ] || { echo "::error::_site/$f is missing or empty"; exit 1; }
          done
          echo "site: $(find _site -type f | wc -l) files"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  # Publishing makes the site public, so it waits for the owner: enable Pages (Settings →
  # Pages → Source: GitHub Actions) and set the repository variable PAGES_ENABLED=true.
  # Until then the site still builds on every push and this job is skipped, not failed.
  deploy:
    if: vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
