name: ci

# Adapted from OpenPresent's .github/workflows/ci.yml (docs/15, docs/19 §Provenance).
on:
  push:
    branches: [main]
  merge_group:
  pull_request:

# Only the newest commit runs: a new push cancels older runs (docs/15).
concurrency:
  group: ci-${{ github.ref }}
  # A run on main always finishes (newer pushes queue), so every merge gets a full result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # crates.io downloads retry instead of failing the job: dependency-policy failed on main
  # (run 44001061169) installing cargo-deny on "Error in the HTTP2 framing layer".
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # a hung test fails the job instead of holding the main queue for 6 h
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
      # Engine crates only: hosts under server/ are native (docs/19).
      - run: cargo check --target wasm32-unknown-unknown --workspace --exclude casual-sign-store --exclude casual-sign-keyd --exclude casual-sign-keyd-client --exclude casual-sign-modeld --exclude casual-sign-convertd --exclude casual-sign-secrets --exclude casual-sign-csc --exclude casual-sign-seclog --exclude casual-sign-host --exclude casual-sign-worker --exclude casual-sign-server --exclude casual-sign-platform-store --exclude casual-sign-console --locked
      - run: python3 tools/check-repo.py
      - run: python3 -I fixtures/tools/generate.py --check
      - run: python3 -I fixtures/corpus/fetch.py --check
      # The production Compose profile's hardening rules, each proven able to fail (HRD-06).
      - run: python3 -I tools/check-deploy.py --self-test
      - run: python3 -I tools/check-deploy.py
      # The SDKs (VS-08E, docs/40 §7): the generated operation tables match
      # api/openapi.yaml, and each client passes its offline tests against the recorded
      # contract (sdk/contract/recorded.json).
      - run: python3 -m venv "$RUNNER_TEMP/sdk" && "$RUNNER_TEMP/sdk/bin/pip" install --quiet pyyaml==6.0.2
      - run: '"$RUNNER_TEMP/sdk/bin/python" tools/build-sdks.py --check'
      - run: node --test sdk/typescript/test/client.test.mjs
      - run: python3 -I -m unittest discover -s sdk/python/tests -t sdk/python

  # Conventional Commits over what this push or pull request adds (CLAUDE.md, Git).
  commit-messages:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # a hung test fails the job instead of holding the main queue for 6 h
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - if: github.event_name == 'pull_request'
        run: python3 tools/check-commits.py --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      # A new branch's `before` is all zeros; then only the pushed commit is checked.
      - if: github.event_name == 'push'
        run: |
          before="${{ github.event.before }}"
          if [ -z "${before//0/}" ]; then range="${{ github.sha }}~1..${{ github.sha }}"; else range="$before..${{ github.sha }}"; fi
          python3 tools/check-commits.py --range "$range"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Engine and server crates on separate runners: no job over 20-25 minutes (owner, 2026-11-19).
        # The engine (and the `openseal` verifier CLI) ships for all three systems; the server
        # ships only as Linux containers, so its crates are tested on Linux only.
        part: [engine, server]
        exclude:
          - os: macos-latest
            part: server
          - os: windows-latest
            part: server
        include:
          - part: engine
            skip: "--exclude casual-sign-store --exclude casual-sign-policy --exclude casual-sign-platform-store --exclude casual-sign-console --exclude casual-sign-keyd-client --exclude casual-sign-secrets --exclude casual-sign-csc --exclude casual-sign-seclog --exclude casual-sign-keyd --exclude casual-sign-modeld --exclude casual-sign-convertd --exclude casual-sign-host --exclude casual-sign-worker --exclude casual-sign-server --exclude clipper2-rust"
          - part: server
            skip: "--exclude casual-sign-model --exclude casual-sign-pdf --exclude casual-sign-crypto --exclude casual-sign-fields --exclude casual-sign-pii --exclude casual-sign-verify --exclude casual-sign-flatten --exclude casual-sign-seal --exclude casual-sign-audit --exclude casual-sign-certificate --exclude casual-sign-sdk --exclude casual-sign-xfa --exclude casual-sign-cli --exclude casual-sign-wasm --exclude casual-sign-workflow"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90   # a hung test fails the job instead of holding the main queue for 6 h
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # modeld's feature_gate test runs `cargo tree --offline --target all`, which needs every
      # platform's crates in the cache, not only the host's (CI-01).
      - run: cargo fetch --locked
      - run: cargo test --workspace ${{ matrix.skip }} --all-features --locked --no-fail-fast

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # a hung test fails the job instead of holding the main queue for 6 h
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: cargo +1.95.0 check --workspace --locked

  dependency-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # a hung test fails the job instead of holding the main queue for 6 h
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo install cargo-deny cargo-audit --locked
      - run: cargo deny check bans licenses sources
      - run: cargo audit --deny warnings

  # Rungs 2 and 3 of the verification ladder (docs/31, F-006): pyHanko and EU DSS must
  # each tell a sealed PDF from a tampered one before they are trusted to judge ours.
  validators:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # a hung test fails the job instead of holding the main queue for 6 h
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -m venv /tmp/v && /tmp/v/bin/pip install --quiet "pyhanko==0.38.1" cryptography
      # Rung 3: EU DSS 6.5.1, built here (LGPL; never linked); with no network over
      # fixtures/sealed, online (--online, --network host) for the HRD-02 interop steps below.
      - run: docker build -q -t openseal-eu-dss tools/eu-dss
      - run: /tmp/v/bin/python -I tools/verify-sealed.py --self-test --dss openseal-eu-dss
      # RSP-01 gates 2 and 3 (and CLAUDE.md's list): pyHanko and EU DSS over the committed
      # seals, the remote-signature revisions and their tampered counterpart included.
      - run: /tmp/v/bin/python -I tools/verify-sealed.py fixtures/sealed --dss openseal-eu-dss
      # HRD-02: a real-style PKI (offline root, issuing CA, OCSP responder, CRLs, an RFC 3161
      # TSA) served on 127.0.0.1; the CLI seals at B-T and B-LTA through it; ours, pyHanko
      # (hard-fail) and EU DSS (--online, the host's network) validate with revocation and
      # timestamps checked, and revoked and tampered seals must fail. Then the committed
      # packet (fixtures/interop) again, its revocation data replayed from files.
      - run: rustup show active-toolchain || { sleep 15; rustup toolchain uninstall 1.96.0; rustup show active-toolchain; }
      - run: cargo build -q -p casual-sign-cli --locked
      - run: /tmp/v/bin/python -I tools/interop/interop.py check --dss openseal-eu-dss --openseal target/debug/openseal
      - run: /tmp/v/bin/python -I tools/interop/interop.py verify fixtures/interop --dss openseal-eu-dss --openseal target/debug/openseal

  # Phase 1 exit item 6 (WASM-01): field rules and the verifier give byte-identical JSON
  # native and in WebAssembly, over every corpus PDF, the signed and hostile fixtures.
  wasm-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # a hung test fails the job instead of holding the main queue for 6 h
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo install wasm-pack --version 0.14.0 --locked
      - name: Restore the corpus
        id: corpus
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: fixtures/corpus/files
          key: corpus-${{ hashFiles('fixtures/corpus/manifest.tsv') }}
      # A second pass picks up what archive.org refused the first time; files already
      # present are only re-hashed.
      - if: steps.corpus.outputs.cache-hit != 'true'
        run: python3 -I fixtures/corpus/fetch.py || { sleep 120; python3 -I fixtures/corpus/fetch.py; }
      - run: tools/wasm-parity.sh

  # Stage 2E (T-2E): seals through PKCS#11 (SoftHSM) and through keyd over mTLS, each
  # accepted by pyHanko. The module path is checked first so the test cannot skip.
  keyd-softhsm:
    runs-on: ubuntu-latest
    timeout-minutes: 75   # a hung test fails the job instead of holding the main queue for 6 h
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Install the pinned toolchain on its own, retried once: a runner image's rustup has
      # failed here with "detected conflict: bin/cargo-clippy".
      - run: rustup show active-toolchain || { sleep 15; rustup toolchain uninstall 1.96.0; rustup show active-toolchain; }
      - run: sudo apt-get update -q && sudo apt-get install -y -q softhsm2
      - run: test -f /usr/lib/softhsm/libsofthsm2.so
      - run: python3 -m venv /tmp/v && /tmp/v/bin/pip install --quiet "pyhanko==0.38.1" cryptography
      - run: cargo test -p casual-sign-keyd -p casual-sign-secrets --locked -- --nocapture
        env:
          SOFTHSM2_MODULE: /usr/lib/softhsm/libsofthsm2.so
          OPENSEAL_VERIFY_PYTHON: /tmp/v/bin/python

  # Stage 2B (T-2B): tenant isolation with RLS on and off, the append-only audit table,
  # migrations and blob stores, against Postgres 17 and SeaweedFS (S3). The offline query
  # cache (ADR-014) must match the migrations.
  store-db:
    runs-on: ubuntu-latest
    timeout-minutes: 75   # a hung test fails the job instead of holding the main queue for 6 h
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: ci-only }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      OPENSEAL_TEST_DATABASE_URL: postgres://postgres:ci-only@127.0.0.1:5432/postgres
      OPENSEAL_TEST_S3_ENDPOINT: http://127.0.0.1:8333
      OPENSEAL_TEST_S3_ACCESS_KEY: ci
      OPENSEAL_TEST_S3_SECRET_KEY: ci-secret
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: S3 (SeaweedFS)
        run: |
          docker run -d --name s3 -p 127.0.0.1:8333:8333 chrislusf/seaweedfs:latest \
            server -dir=/data -s3 -s3.port=8333 -ip.bind=0.0.0.0
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8333 && break; sleep 2; done
      - run: cargo install sqlx-cli --version 0.9.0 --no-default-features --features postgres,rustls --locked --root "$RUNNER_TEMP/sqlx-cli"
      - name: Offline query cache matches the migrations
        run: SQLX_CLI_BIN="$RUNNER_TEMP/sqlx-cli/bin" server/casual-sign-store/sqlx-prepare.sh --check
      - run: cargo test -p casual-sign-store --locked

  # Stages 2C and 2D (T-2C, T-2D, GEO-01): the shared decide-and-record path, the API
  # server's contract, isolation, auth, evidence and location tests, the worker's jobs,
  # crash tests and seal, and the end-to-end test (API and worker to `completed`, the
  # sealed PDF and certificate checked by ours and pyHanko), against Postgres 17.
  server-db:
    runs-on: ubuntu-latest
    # Three groups on separate runners: no job over 20-25 minutes (owner, 2026-11-19).
    strategy:
      fail-fast: false
      matrix:
        group: [store, server, worker]
        include:
          - group: store
            crates: -p casual-sign-store -p casual-sign-host -p casual-sign-platform-store -p casual-sign-console
          - group: server
            crates: -p casual-sign-server
          - group: worker
            crates: -p casual-sign-worker
    timeout-minutes: 75   # a hung test fails the job instead of holding the main queue for 6 h
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: ci-only }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      OPENSEAL_TEST_DATABASE_URL: postgres://postgres:ci-only@127.0.0.1:5432/postgres
      OPENSEAL_VERIFY_PYTHON: /tmp/v/bin/python
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -m venv /tmp/v && /tmp/v/bin/pip install --quiet "pyhanko==0.38.1" cryptography
      - run: cargo test ${{ matrix.crates }} --locked
      # P2-CRASH (Phase 2 exit item 2): the real server and worker binaries, built with the
      # test-only crash points, SIGKILLed at every effect boundary and restarted.
      - if: matrix.group == 'worker'
        run: cargo build -p casual-sign-server --features crash-points --locked
      - if: matrix.group == 'worker'
        run: cargo test -p casual-sign-worker --features crash-points --test process_crash --locked

  # WEB-01, E2E-01: web app unit tests, then Playwright in Chromium, WebKit and a phone
  # viewport (mock mode until the Compose deployment, 2F), with axe on every screen.
  # VS-07: the WebAssembly verifier is built first (as pages.yml builds it), so the
  # Verify specs run the real verifier instead of skipping; the build is cached on the
  # sources it is made from, and the job fails if it is missing.
  # Eight shards, one test at a time in each (owner, 2026-11-19: no job over 20-25 minutes).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75   # a hung test fails the job instead of holding the main queue for 6 h
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Restore the WebAssembly verifier
        id: wasm
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: webapp/vendor/openseal-wasm
          key: webapp-wasm-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**', 'tools/build-webapp-wasm.sh') }}
      - if: steps.wasm.outputs.cache-hit != 'true'
        run: rustup show active-toolchain || { sleep 15; rustup toolchain uninstall 1.96.0; rustup show active-toolchain; }
      - if: steps.wasm.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --version 0.14.0 --locked
      - if: steps.wasm.outputs.cache-hit != 'true'
        name: Build the WebAssembly verifier
        run: tools/build-webapp-wasm.sh
      - name: The verifier is there (the Verify specs must run, not skip)
        run: |
          test -s webapp/vendor/openseal-wasm/casual_sign_wasm_bg.wasm
          test -s webapp/vendor/openseal-wasm/casual_sign_wasm.js
      - if: matrix.shard == 1
        working-directory: webapp
        run: npm test
      # In the Playwright image, which carries the browsers and their libraries, so no
      # shard waits on apt (#34: an apt install stalled two shards for 25 minutes).
      - run: |
          env | grep -E '^(OPENSEAL_|CI=)' > "$RUNNER_TEMP/e2e.env" || true
          docker run --rm --ipc=host --env-file "$RUNNER_TEMP/e2e.env" -e GITHUB_WORKSPACE \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE/webapp/e2e" \
            mcr.microsoft.com/playwright:v1.64.1-noble \
            sh -c 'command -v python3 >/dev/null || { apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 >/dev/null; }; npm ci && npx playwright test --shard=${{ matrix.shard }}/8; s=$?; chmod -R a+rwX "$GITHUB_WORKSPACE/target" 2>/dev/null; exit $s'
      # The slice 7 demo (VS-07): the Verify page checking a sealed and a tampered PDF,
      # recorded by verify-demo.spec.mjs in Chromium and WebKit, in whichever shard ran it.
      - if: success() && hashFiles('target/e2e-demo/vs07-*') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slice-7-demo-${{ matrix.shard }}
          path: target/e2e-demo/vs07-*
          if-no-files-found: error
          retention-days: 90
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-results-${{ matrix.shard }}
          path: target/e2e-results
          retention-days: 7

  # T-2F, E2E-01 (Phase 2 exit item 1, in a browser): the Compose deployment built from
  # this commit, the Playwright specs against it with mock off (sign in, send to two
  # signers in order, each signs through the link read from Mailpit, the sender downloads
  # the sealed PDF and certificate), then pyHanko over the downloads against the stack's
  # generated root. The stack is torn down with its volumes however the job ends.
  # RAUTH-02: the CI-only overlay tools/e2e/compose.e2e.yml (COMPOSE_FILE, so every
  # `docker compose` here uses it) adds an SMS gateway stub and an OpenID Connect provider
  # stub, so slice 5's spec runs its codes and sign-in against the real server; never part
  # of docker-compose.yml or the production profile.
  compose-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75   # a hung test fails the job instead of holding the main queue for 6 h
    # Two shards, each against its own stack (no job over 20-25 minutes, owner 2026-11-19).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      COMPOSE_FILE: docker-compose.yml:tools/e2e/compose.e2e.yml
      OPENSEAL_E2E_BASE_URL: http://localhost:8080
      OPENSEAL_E2E_MAIL_URL: http://127.0.0.1:8025
      OPENSEAL_E2E_SMS_URL: http://127.0.0.1:8026
      OPENSEAL_E2E_EMAIL: e2e@openseal.test
      OPENSEAL_E2E_PASSWORD: e2e-only-passphrase
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -I -m unittest discover -s tools/e2e -p 'test_*.py'
      - run: docker compose up -d --build --wait
      - run: docker compose exec -T -e OPENSEAL_ADMIN_PASSWORD="$OPENSEAL_E2E_PASSWORD" server casual-sign-server bootstrap "E2E" "$OPENSEAL_E2E_EMAIL" "E2E Admin"
      # VS-07: the server image carries the WebAssembly verifier (deploy/Dockerfile's wasm
      # stage), so the Verify specs run against it; checked here so they cannot pass on a
      # page that says the verifier is missing.
      - name: The server serves the WebAssembly verifier
        run: |
          type=$(curl -fsS -o /dev/null -w '%{content_type}' "$OPENSEAL_E2E_BASE_URL/vendor/openseal-wasm/casual_sign_wasm_bg.wasm")
          echo "casual_sign_wasm_bg.wasm: $type"
          test "$type" = application/wasm
          curl -fsS -o /dev/null "$OPENSEAL_E2E_BASE_URL/vendor/openseal-wasm/casual_sign_wasm.js"
      # In the Playwright image on the host network (#34: apt installs stalled on the runner).
      - run: |
          env | grep -E '^(OPENSEAL_|CI=)' > "$RUNNER_TEMP/e2e.env"
          docker run --rm --network host --ipc=host --env-file "$RUNNER_TEMP/e2e.env" -e GITHUB_WORKSPACE \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE/webapp/e2e" \
            mcr.microsoft.com/playwright:v1.64.1-noble \
            sh -c 'npm ci && npx playwright test --project=chromium --project=webkit --shard=${{ matrix.shard }}/4; s=$?; chmod -R a+rwX "$GITHUB_WORKSPACE/target" 2>/dev/null; exit $s'
      - run: mkdir -p target/e2e-sealed && docker compose exec -T keyd cat /secrets/ca.pem > target/e2e-sealed/trust-root.pem
      - run: python3 -m venv /tmp/v && /tmp/v/bin/pip install --quiet "pyhanko==0.38.1" cryptography
      - if: hashFiles('target/e2e-sealed/*.pdf') != ''
        run: /tmp/v/bin/python tools/verify-sealed.py target/e2e-sealed
      # The slice 1 demo (S1-02): the VS-01 run recorded, sender and phone, kept with
      # the sealed PDFs and certificates it downloaded.
      - if: success() && hashFiles('target/e2e-demo/vs01-*') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slice-1-demo-${{ matrix.shard }}
          path: |
            target/e2e-demo/vs01-*
            target/e2e-sealed/*vs01-*
          if-no-files-found: error
          retention-days: 90
      # The slice 5 demo (RAUTH-02): recipient-auth.spec.mjs on this stack, recorded, the
      # signer's screens: an access code and codes by email, SMS and voice call on a phone,
      # then sign-in at the identity provider stub on a desktop; each ends by consenting and
      # withdrawing consent.
      - if: success() && hashFiles('target/e2e-demo/vs05-*') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slice-5-demo-${{ matrix.shard }}
          path: target/e2e-demo/vs05-*
          if-no-files-found: error
          retention-days: 90
      # The slice 2 demo (RTE-04): routing.spec.mjs's VS-02 run recorded (sender, approver,
      # viewer, agent, the named signer), kept with the sealed PDFs and certificates.
      - if: success() && hashFiles('target/e2e-demo/vs02-*') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slice-2-demo-${{ matrix.shard }}
          path: |
            target/e2e-demo/vs02-*
            target/e2e-sealed/*vs02-*
          if-no-files-found: error
          retention-days: 90
      # The slice 3 demo (VS-03): templates.spec.mjs's run recorded (the sender's template
      # folder, using two templates together, save as template; each signer signing).
      - if: success() && hashFiles('target/e2e-demo/vs03-*') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slice-3-demo-${{ matrix.shard }}
          path: target/e2e-demo/vs03-*
          if-no-files-found: error
          retention-days: 90
      # The slice 4 demo (VS-04B): fields.spec.mjs's run recorded (the signer filling every
      # kind, a condition showing a field, a formula computing, linked fields mirroring).
      - if: success() && hashFiles('target/e2e-demo/vs04-*') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slice-4-demo-${{ matrix.shard }}
          path: target/e2e-demo/vs04-*
          if-no-files-found: error
          retention-days: 90
      # The slice 8 demo (VS-08C): api-webhooks.spec.mjs's run recorded (an API key made,
      # an envelope sent with it, signed deliveries at the CI receiver, a failed one
      # delivered again, an app allowed through the consent screen).
      - if: success() && hashFiles('target/e2e-demo/vs08-*') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slice-8-demo-${{ matrix.shard }}
          path: target/e2e-demo/vs08-*
          if-no-files-found: error
          retention-days: 90
      # The slice 9 demo (VS-09E): embedding.spec.mjs's run recorded (a host page on another
      # site embedding a signing, a prepare and a correct view and hearing their events).
      - if: success() && hashFiles('target/e2e-demo/vs09-*') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slice-9-demo-${{ matrix.shard }}
          path: target/e2e-demo/vs09-*
          if-no-files-found: error
          retention-days: 90
      # The slice 6 demo (VS-06B): manage-correct.spec.mjs's run recorded (a failed access
      # code in the Authentication failed view, resend, custom fields and their search,
      # documents corrected, a copy, the server's reports, a transfer).
      - if: success() && hashFiles('target/e2e-demo/vs06-*') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slice-6-demo-${{ matrix.shard }}
          path: target/e2e-demo/vs06-*
          if-no-files-found: error
          retention-days: 90
      - if: failure()
        run: mkdir -p target && docker compose logs --no-color > target/compose.log 2>&1
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compose-e2e-results-${{ matrix.shard }}
          path: |
            target/e2e-results
            target/compose.log
          retention-days: 7
      - if: always()
        run: docker compose down -v

  # ASVS-14 (ASVS 8.1.5, 8.1.6): the restore drill, gated like compose-e2e. A Compose stack
  # built from this commit signs and seals one envelope and half signs another, is backed
  # up (encrypted, signed), destroyed with its volumes, and restored into a fresh stack with
  # its own keys; the sealed PDF must be byte-identical, every chain must verify, and the
  # half-signed envelope must finish and be sealed there (tools/backup/drill.sh). The
  # restore is also compared with what was read from the first stack before the backup
  # (audit chain hashes, keyd's log bytes, the seal root), and pyHanko validates both
  # sealed PDFs. The artifact `backup-drill` is the drill's evidence (docs/65 §The drill):
  # report.json (verdict, commit, restore time), the console log and each check's output;
  # never the backup, its keys or the drill's signing links.
  backup-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 75   # a hung test fails the job instead of holding the main queue for 6 h
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -m venv /tmp/v && /tmp/v/bin/pip install --quiet "pyhanko==0.38.1" cryptography
      - shell: bash # -eo pipefail: the drill's status, not tee's
        env:
          OPENSEAL_DRILL_VALIDATOR_PYTHON: /tmp/v/bin/python
        run: |
          mkdir -p target
          tools/backup/drill.sh 2>&1 | tee target/backup-drill.log
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backup-drill
          path: |
            target/backup-drill.log
            target/backup-drill/report.json
            target/backup-drill/restore.json
            target/backup-drill/evidence-after.txt
            target/backup-drill/oplog-after.txt
            target/backup-drill/verify-sealed.txt
            target/backup-drill/payload-structure.txt
            target/backup-drill/flipped.err
            target/backup-drill/edited.err
            target/backup-drill/sealed-a/
            target/backup-drill/sealed-b/
            target/backup-drill/sealed-cross/
            target/backup-drill/compose-*.log
          if-no-files-found: ignore
          retention-days: 90

  # HRD-10 (HRD-01's exit gate, docs/06 §Hardening release): the HRD-01 chaos cases on the
  # hardened profile. deploy/compose.production.yml built from this commit, with throwaway
  # secrets from deploy/production/init-secrets.sh, SoftHSM as the PKCS#11 token, and the
  # CI-only tools/chaos/compose.chaos.yml (STARTTLS mail sink, a TSA behind a holding gate,
  # the evidence verifier; no development switch). Envelopes go through the API while
  # workers are paused past their lease and SIGKILLed mid-seal, keyd is stopped, and
  # PostgreSQL and the object store are killed; each must end completed on exactly one
  # seal (or completing with a job_dead alert), verify-evidence and keyd's log must
  # verify, and pyHanko must validate every sealed PDF (tools/chaos/chaos_compose.py).
  chaos-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Two scenario groups on separate runners, each on a fresh stack (no job over 20-25 minutes).
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -I -m unittest discover -s tools/chaos -p 'test_*.py'
      - run: python3 -m venv /tmp/v && /tmp/v/bin/pip install --quiet "pyhanko==0.38.1" cryptography
      - run: python3 -I tools/chaos/chaos_compose.py run --part ${{ matrix.part }} --verify-python /tmp/v/bin/python
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chaos-compose-${{ matrix.part }}
          path: |
            target/chaos-compose/report.json
            target/chaos-compose/evidence.txt
            target/chaos-compose/oplog.txt
            target/chaos-compose/verify-sealed.txt
            target/chaos-compose/sealed
            target/chaos-compose/compose.log
          if-no-files-found: ignore
          retention-days: 90
