name: ci

# Adapted from OpenPresent's .github/workflows/ci.yml (docs/15, docs/19 §Provenance).
on:
  push:
    branches: [main]
  merge_group:
  pull_request:

# Only the newest commit runs: a new push cancels older runs (docs/15).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
      # Engine crates only: hosts under server/ are native (docs/19).
      - run: cargo check --target wasm32-unknown-unknown --workspace --exclude casual-sign-store --exclude casual-sign-keyd --locked
      - run: python3 tools/check-repo.py
      - run: python3 -I fixtures/tools/generate.py --check
      - run: python3 -I fixtures/corpus/fetch.py --check

  # Conventional Commits over what this push or pull request adds (CLAUDE.md, Git).
  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - if: github.event_name == 'pull_request'
        run: python3 tools/check-commits.py --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      # A new branch's `before` is all zeros; then only the pushed commit is checked.
      - if: github.event_name == 'push'
        run: |
          before="${{ github.event.before }}"
          if [ -z "${before//0/}" ]; then range="${{ github.sha }}~1..${{ github.sha }}"; else range="$before..${{ github.sha }}"; fi
          python3 tools/check-commits.py --range "$range"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo test --workspace --all-features --locked --no-fail-fast

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 check --workspace --locked

  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo install cargo-deny cargo-audit --locked
      - run: cargo deny check bans licenses sources
      - run: cargo audit --deny warnings

  # Rungs 2 and 3 of the verification ladder (docs/31, F-006): pyHanko and EU DSS must
  # each tell a sealed PDF from a tampered one before they are trusted to judge ours.
  validators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -m venv /tmp/v && /tmp/v/bin/pip install --quiet "pyhanko==0.38.1" cryptography
      # Rung 3: EU DSS 6.5.1, built here, run with no network (LGPL; never linked).
      - run: docker build -q -t openseal-eu-dss tools/eu-dss
      - run: /tmp/v/bin/python -I tools/verify-sealed.py --self-test --dss openseal-eu-dss

  # Phase 1 exit item 6 (WASM-01): field rules and the verifier give byte-identical JSON
  # native and in WebAssembly, over every corpus PDF, the signed and hostile fixtures.
  wasm-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo install wasm-pack --version 0.14.0 --locked
      - name: Restore the corpus
        id: corpus
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: fixtures/corpus/files
          key: corpus-${{ hashFiles('fixtures/corpus/manifest.tsv') }}
      - if: steps.corpus.outputs.cache-hit != 'true'
        run: python3 -I fixtures/corpus/fetch.py
      - run: tools/wasm-parity.sh
