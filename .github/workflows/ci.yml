name: ci

# Adapted from OpenPresent's .github/workflows/ci.yml (docs/15, docs/19 §Provenance).
on:
  push:
    branches: [main]
  merge_group:
  pull_request:

# Only the newest commit runs: a new push cancels older runs (docs/15).
concurrency:
  group: ci-${{ github.ref }}
  # A run on main always finishes (newer pushes queue), so every merge gets a full result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
      # Engine crates only: hosts under server/ are native (docs/19).
      - run: cargo check --target wasm32-unknown-unknown --workspace --exclude casual-sign-store --exclude casual-sign-keyd --exclude casual-sign-keyd-client --exclude casual-sign-modeld --exclude casual-sign-secrets --exclude casual-sign-host --exclude casual-sign-worker --exclude casual-sign-server --exclude casual-sign-platform-store --exclude casual-sign-console --locked
      - run: python3 tools/check-repo.py
      - run: python3 -I fixtures/tools/generate.py --check
      - run: python3 -I fixtures/corpus/fetch.py --check

  # Conventional Commits over what this push or pull request adds (CLAUDE.md, Git).
  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - if: github.event_name == 'pull_request'
        run: python3 tools/check-commits.py --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      # A new branch's `before` is all zeros; then only the pushed commit is checked.
      - if: github.event_name == 'push'
        run: |
          before="${{ github.event.before }}"
          if [ -z "${before//0/}" ]; then range="${{ github.sha }}~1..${{ github.sha }}"; else range="$before..${{ github.sha }}"; fi
          python3 tools/check-commits.py --range "$range"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # modeld's feature_gate test runs `cargo tree --offline --target all`, which needs every
      # platform's crates in the cache, not only the host's (CI-01).
      - run: cargo fetch --locked
      - run: cargo test --workspace --all-features --locked --no-fail-fast

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: cargo +1.95.0 check --workspace --locked

  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo install cargo-deny cargo-audit --locked
      - run: cargo deny check bans licenses sources
      - run: cargo audit --deny warnings

  # Rungs 2 and 3 of the verification ladder (docs/31, F-006): pyHanko and EU DSS must
  # each tell a sealed PDF from a tampered one before they are trusted to judge ours.
  validators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -m venv /tmp/v && /tmp/v/bin/pip install --quiet "pyhanko==0.38.1" cryptography
      # Rung 3: EU DSS 6.5.1, built here (LGPL; never linked); with no network over
      # fixtures/sealed, online (--online, --network host) for the HRD-02 interop steps below.
      - run: docker build -q -t openseal-eu-dss tools/eu-dss
      - run: /tmp/v/bin/python -I tools/verify-sealed.py --self-test --dss openseal-eu-dss
      # HRD-02: a real-style PKI (offline root, issuing CA, OCSP responder, CRLs, an RFC 3161
      # TSA) served on 127.0.0.1; the CLI seals at B-T and B-LTA through it; ours, pyHanko
      # (hard-fail) and EU DSS (--online, the host's network) validate with revocation and
      # timestamps checked, and revoked and tampered seals must fail. Then the committed
      # packet (fixtures/interop) again, its revocation data replayed from files.
      - run: rustup show active-toolchain || { sleep 15; rustup toolchain uninstall 1.96.0; rustup show active-toolchain; }
      - run: cargo build -q -p casual-sign-cli --locked
      - run: /tmp/v/bin/python -I tools/interop/interop.py check --dss openseal-eu-dss --openseal target/debug/openseal
      - run: /tmp/v/bin/python -I tools/interop/interop.py verify fixtures/interop --dss openseal-eu-dss --openseal target/debug/openseal

  # Phase 1 exit item 6 (WASM-01): field rules and the verifier give byte-identical JSON
  # native and in WebAssembly, over every corpus PDF, the signed and hostile fixtures.
  wasm-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo install wasm-pack --version 0.14.0 --locked
      - name: Restore the corpus
        id: corpus
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: fixtures/corpus/files
          key: corpus-${{ hashFiles('fixtures/corpus/manifest.tsv') }}
      # A second pass picks up what archive.org refused the first time; files already
      # present are only re-hashed.
      - if: steps.corpus.outputs.cache-hit != 'true'
        run: python3 -I fixtures/corpus/fetch.py || { sleep 120; python3 -I fixtures/corpus/fetch.py; }
      - run: tools/wasm-parity.sh

  # Stage 2E (T-2E): seals through PKCS#11 (SoftHSM) and through keyd over mTLS, each
  # accepted by pyHanko. The module path is checked first so the test cannot skip.
  keyd-softhsm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Install the pinned toolchain on its own, retried once: a runner image's rustup has
      # failed here with "detected conflict: bin/cargo-clippy".
      - run: rustup show active-toolchain || { sleep 15; rustup toolchain uninstall 1.96.0; rustup show active-toolchain; }
      - run: sudo apt-get update -q && sudo apt-get install -y -q softhsm2
      - run: test -f /usr/lib/softhsm/libsofthsm2.so
      - run: python3 -m venv /tmp/v && /tmp/v/bin/pip install --quiet "pyhanko==0.38.1" cryptography
      - run: cargo test -p casual-sign-keyd -p casual-sign-secrets --locked -- --nocapture
        env:
          SOFTHSM2_MODULE: /usr/lib/softhsm/libsofthsm2.so
          OPENSEAL_VERIFY_PYTHON: /tmp/v/bin/python

  # Stage 2B (T-2B): tenant isolation with RLS on and off, the append-only audit table,
  # migrations and blob stores, against Postgres 17 and SeaweedFS (S3). The offline query
  # cache (ADR-014) must match the migrations.
  store-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: ci-only }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      OPENSEAL_TEST_DATABASE_URL: postgres://postgres:ci-only@127.0.0.1:5432/postgres
      OPENSEAL_TEST_S3_ENDPOINT: http://127.0.0.1:8333
      OPENSEAL_TEST_S3_ACCESS_KEY: ci
      OPENSEAL_TEST_S3_SECRET_KEY: ci-secret
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: S3 (SeaweedFS)
        run: |
          docker run -d --name s3 -p 127.0.0.1:8333:8333 chrislusf/seaweedfs:latest \
            server -dir=/data -s3 -s3.port=8333 -ip.bind=0.0.0.0
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8333 && break; sleep 2; done
      - run: cargo install sqlx-cli --version 0.9.0 --no-default-features --features postgres,rustls --locked --root "$RUNNER_TEMP/sqlx-cli"
      - name: Offline query cache matches the migrations
        run: SQLX_CLI_BIN="$RUNNER_TEMP/sqlx-cli/bin" server/casual-sign-store/sqlx-prepare.sh --check
      - run: cargo test -p casual-sign-store --locked

  # Stages 2C and 2D (T-2C, T-2D, GEO-01): the shared decide-and-record path, the API
  # server's contract, isolation, auth, evidence and location tests, the worker's jobs,
  # crash tests and seal, and the end-to-end test (API and worker to `completed`, the
  # sealed PDF and certificate checked by ours and pyHanko), against Postgres 17.
  server-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: ci-only }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      OPENSEAL_TEST_DATABASE_URL: postgres://postgres:ci-only@127.0.0.1:5432/postgres
      OPENSEAL_VERIFY_PYTHON: /tmp/v/bin/python
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -m venv /tmp/v && /tmp/v/bin/pip install --quiet "pyhanko==0.38.1" cryptography
      - run: cargo test -p casual-sign-store -p casual-sign-host -p casual-sign-worker -p casual-sign-server -p casual-sign-platform-store -p casual-sign-console --locked
      # P2-CRASH (Phase 2 exit item 2): the real server and worker binaries, built with the
      # test-only crash points, SIGKILLed at every effect boundary and restarted.
      - run: cargo build -p casual-sign-server --features crash-points --locked
      - run: cargo test -p casual-sign-worker --features crash-points --test process_crash --locked

  # WEB-01, E2E-01: web app unit tests, then Playwright in Chromium, WebKit and a phone
  # viewport (mock mode until the Compose deployment, 2F), with axe on every screen.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - working-directory: webapp
        run: npm test
      - working-directory: webapp/e2e
        run: npm ci && npx playwright install --with-deps chromium webkit
      - working-directory: webapp/e2e
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-results
          path: target/e2e-results
          retention-days: 7

  # T-2F, E2E-01 (Phase 2 exit item 1, in a browser): the Compose deployment built from
  # this commit, the Playwright specs against it with mock off (sign in, send to two
  # signers in order, each signs through the link read from Mailpit, the sender downloads
  # the sealed PDF and certificate), then pyHanko over the downloads against the stack's
  # generated root. The stack is torn down with its volumes however the job ends.
  compose-e2e:
    runs-on: ubuntu-latest
    env:
      OPENSEAL_E2E_BASE_URL: http://localhost:8080
      OPENSEAL_E2E_MAIL_URL: http://127.0.0.1:8025
      OPENSEAL_E2E_EMAIL: e2e@openseal.test
      OPENSEAL_E2E_PASSWORD: e2e-only-passphrase
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker compose up -d --build --wait
      - run: docker compose exec -T -e OPENSEAL_ADMIN_PASSWORD="$OPENSEAL_E2E_PASSWORD" server casual-sign-server bootstrap "E2E" "$OPENSEAL_E2E_EMAIL" "E2E Admin"
      - working-directory: webapp/e2e
        run: npm ci && npx playwright install --with-deps chromium webkit
      - working-directory: webapp/e2e
        run: npx playwright test --project=chromium --project=webkit
      - run: docker compose exec -T keyd cat /secrets/ca.pem > target/e2e-sealed/trust-root.pem
      - run: python3 -m venv /tmp/v && /tmp/v/bin/pip install --quiet "pyhanko==0.38.1" cryptography
      - run: /tmp/v/bin/python tools/verify-sealed.py target/e2e-sealed
      # The slice 1 demo (S1-02): the VS-01 run recorded, sender and phone, kept with
      # the sealed PDFs and certificates it downloaded.
      - if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slice-1-demo
          path: |
            target/e2e-demo
            target/e2e-sealed/*vs01-*
          if-no-files-found: error
          retention-days: 90
      - if: failure()
        run: mkdir -p target && docker compose logs --no-color > target/compose.log 2>&1
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compose-e2e-results
          path: |
            target/e2e-results
            target/compose.log
          retention-days: 7
      - if: always()
        run: docker compose down -v
