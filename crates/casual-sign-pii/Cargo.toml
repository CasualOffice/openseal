[package]
name = "casual-sign-pii"
version = "0.0.1"
description = "OpenSeal personal-data recognisers: deterministic pattern, checksum and context rules for email, phone, IBAN, card, national ids, IP addresses and dates of birth, identical natively and in WASM (ML-08, docs/33)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Linear-time matching with no backtracking, so no text can cause ReDoS; already in the
# engine through casual-sign-fields (same features).
regex = { version = "1.10", default-features = false, features = ["std", "unicode", "perf"] }
# A port of Google's libphonenumber metadata and validation (Apache-2.0); the same
# approach Presidio takes through Python `phonenumbers`. It declares no features; its
# metadata is compiled in by its build script, so nothing is read at run time. Builds
# for wasm32-unknown-unknown (checked 2026-11-12, ADR-029 D7). It is handed only short
# ASCII candidates of digits and separators, never document text (src/phone.rs).
phonenumber = { version = "=0.3.10", default-features = false }

[dev-dependencies]
proptest = { version = "1.5", default-features = false, features = ["std"] }

[lints]
workspace = true
