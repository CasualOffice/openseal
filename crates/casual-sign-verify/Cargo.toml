[package]
name = "casual-sign-verify"
version = "0.0.0"
description = "OpenSeal verifier: any signed PDF, its revisions, chains, revocation and timestamps (docs/31 §7)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["rsa"]
# RSA verification (PKCS#1 v1.5 and PSS) of signers, certificates, OCSP and CRLs. On by
# default: most real CAs and TSAs are RSA. Verify only (ADR-006, DEP-02).
rsa = ["casual-sign-crypto/rsa", "dep:rsa"]

[dependencies]
casual-sign-pdf = { path = "../casual-sign-pdf" }
casual-sign-crypto = { path = "../casual-sign-crypto" }
# The RustCrypto der-0.8 generation casual-sign-crypto already pins (ADR-006), so the
# dependency graph does not grow. Needed here for certificate fields, OCSP responder
# certificates, and for checking a certificate's signature with its issuer's key, which
# casual-sign-crypto does not expose yet (reported in T-1H).
der = { version = "0.8.3", default-features = false, features = ["alloc", "derive", "oid"] }
spki = { version = "0.8.1", default-features = false, features = ["alloc"] }
x509-cert = { version = "0.3.0", default-features = false }
x509-ocsp = { version = "=0.3.0-rc.1", default-features = false }
sha2 = { version = "0.11.1", default-features = false, features = ["oid"] }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
p384 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
rsa = { version = "0.10.0", default-features = false, features = ["encoding", "pkcs1v15"], optional = true }

[lints]
workspace = true
