[package]
name = "casual-sign-fields"
version = "0.0.0"
description = "Field validation, conditional visibility, group rules and formulas for OpenSeal, identical natively and in WASM (docs/30 §6)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
casual-sign-model = { path = "../casual-sign-model" }
# Text with positions, anchors, tags and AcroForm conversion read the admitted PDF
# (docs/19 plans this edge; docs/30 §4–5).
casual-sign-pdf = { path = "../casual-sign-pdf" }
# A sender's validation pattern is untrusted: `regex` guarantees linear-time matching
# and takes size limits, so no pattern can cause ReDoS. Unicode tables are kept so a
# pattern behaves the same for every script.
regex = { version = "1.10", default-features = false, features = ["std", "unicode", "perf"] }
# Formulas are decimal, never float, so browser and server agree exactly (ADR-022).
rust_decimal = { version = "1.37", default-features = false, features = ["std"] }
# Labels compare after NFC, so "café" typed two ways is one label (docs/19).
unicode-normalization = { version = "0.1.24", default-features = false, features = ["std"] }

[dev-dependencies]
proptest = { version = "1.5", default-features = false, features = ["std"] }

[lints]
workspace = true
