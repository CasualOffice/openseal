[package]
name = "casual-sign-certificate"
version = "0.0.0"
description = "OpenSeal certificate of completion and embedded audit trail (docs/30 §8, docs/32 §6)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
casual-sign-audit = { path = "../casual-sign-audit" }
# Text layout, subset font embedding and signature art: the certificate's pages are
# drawn by the flattener, never by a second text engine.
casual-sign-flatten = { path = "../casual-sign-flatten" }
casual-sign-model = { path = "../casual-sign-model" }
casual-sign-pdf = { path = "../casual-sign-pdf" }
# Field placements are decimal points (ADR-019, ADR-022). Already in the tree through
# `casual-sign-model`, same features. MIT.
rust_decimal = { version = "1.37", default-features = false, features = ["std"] }
# The embedded file's `/CheckSum`, which ISO 32000-2 §7.11.4.2 defines as MD5 of the
# file. An integrity hint for PDF readers only, never a security control: the seal
# covers the file, and the certificate prints its SHA-256. RustCrypto, already in the
# tree (lopdf's test oracle). MIT OR Apache-2.0.
md-5 = { version = "0.11", default-features = false }

[dev-dependencies]
# Reading a rendered certificate's text in its tests (WEB-06). Already a dependency
# of `casual-sign-flatten`.
casual-sign-fields = { path = "../casual-sign-fields" }

[lints]
workspace = true
