[package]
name = "casual-sign-workflow"
version = "0.0.0"
description = "OpenSeal workflow engine: envelope and recipient state machines, routing, commands, events and effects as a pure function (stage 2A, docs/24)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
casual-sign-model = { path = "../casual-sign-model" }
# Audit event types, `Personal`, `Hash256`, `Timestamp`, and RFC 8785 for value and
# command hashes (ADR-010). The chain itself stays in -audit.
casual-sign-audit = { path = "../casual-sign-audit" }
# Field rules re-run on the server at completion (docs/24 §5) and checked at send.
casual-sign-fields = { path = "../casual-sign-fields" }
# State, commands and effects travel as JSON between server, store and job queue.
# Already in the tree through -model and -audit. MIT OR Apache-2.0.
serde = { version = "1.0.200", features = ["derive"] }
# Commands and values to canonical JSON for their hashes. Already in the tree. MIT OR
# Apache-2.0.
serde_json = "1.0.120"

[dev-dependencies]
# Property tests over random command sequences (stage 2A gate). Already in the tree as
# a dev-dependency of -audit and -fields. MIT OR Apache-2.0.
proptest = { version = "1.5", default-features = false, features = ["std"] }

[lints]
workspace = true
