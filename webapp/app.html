<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- docs/47 §As built: CSP. The server also sends it as a header, with frame-ancestors. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="openseal-api-base" content="">
  <title>OpenSeal</title>
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="prepare.css">
  <link rel="stylesheet" href="manage.css">
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="auth.css">
  <script type="module" src="app.js"></script>
</head>
<body class="os-app">
  <a class="os-skip" href="#main" data-i18n="a11y.skip">Skip to content</a>
  <div id="mock-banner" class="os-mock-banner" role="note" hidden><span data-i18n="mock.banner">Demo mode</span></div>
  <!-- Top navigation (docs/47 §As built: shell): brand, sections, Start, search, help,
       notifications, account. Below 960 px the sections fold into a drawer behind Menu
       (with a scrim) and search into a button that opens a row under the bar (UX-04). -->
  <header class="os-topbar">
    <button type="button" id="nav-toggle" class="os-btn os-btn--ghost os-btn--md os-btn--icon os-nav-toggle" aria-controls="nav" aria-expanded="false" data-i18n-attr="aria-label:nav.menu;title:nav.menu"></button>
    <a class="os-brand" href="#/home" data-i18n-attr="aria-label:nav.home">
      <img class="os-logo--light" src="assets/logo.svg" alt="" width="123" height="24">
      <img class="os-logo--dark" src="assets/logo-dark.svg" alt="" width="123" height="24">
    </a>
    <nav id="nav" class="os-nav" data-i18n-attr="aria-label:nav.label">
      <a class="os-nav__link" href="#/home" data-nav="home" data-icon="house"><span data-i18n="nav.home-link">Home</span></a>
      <a class="os-nav__link" href="#/agreements" data-nav="agreements" data-icon="inbox"><span data-i18n="nav.agreements">Agreements</span></a>
      <a class="os-nav__link" href="#/templates" data-nav="templates" data-icon="layout-template"><span data-i18n="nav.templates">Templates</span></a>
      <a class="os-nav__link" href="#/reports" data-nav="reports" data-icon="chart-column"><span data-i18n="nav.reports">Reports</span></a>
      <a class="os-nav__link" href="#/admin" data-nav="admin" data-icon="settings" id="nav-admin" hidden><span data-i18n="nav.admin">Admin</span></a>
      <a class="os-nav__link os-nav__link--drawer" href="verify.html" data-nav="verify" data-icon="shield-check"><span data-i18n="nav.verify">Verify a PDF</span></a>
    </nav>
    <span class="os-spacer"></span>
    <div id="start-slot" class="os-start"></div>
    <form class="os-topsearch" role="search" id="top-search-form">
      <label class="os-sr-only" for="top-search" data-i18n="agreements.search">Search agreements</label>
      <input id="top-search" class="os-input os-topsearch__input" type="search" autocomplete="off" data-i18n-attr="placeholder:top.search-placeholder">
    </form>
    <div id="help-slot"></div>
    <div id="bell-slot"></div>
    <div id="account-slot"></div>
  </header>
  <div id="nav-scrim" class="os-nav-scrim" hidden></div>
  <main id="main" class="os-main" tabindex="-1"></main>
</body>
</html>
