<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- docs/47 §As built: CSP. The server also sends it as a header, with frame-ancestors. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="openseal-api-base" content="">
  <title>OpenSeal</title>
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/ui/geist-1.3.1-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="prepare.css">
  <link rel="stylesheet" href="manage.css">
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="auth.css">
  <script type="module" src="app.js"></script>
</head>
<body class="os-app">
  <a class="os-skip" href="#main" data-i18n="a11y.skip">Skip to content</a>
  <!-- The shell (WEB-17, docs/47 §As built: design foundation; the design canvas's Main
       artboard): a quiet sidebar on the window colour, and the routed screen in a white
       content card inset 0.5rem that scrolls on its own. Below 60em the sidebar is a
       drawer behind Menu (with a scrim) and a compact top row holds Menu, the logo,
       search, notifications and the account. Frame routes (the editor) and sign-in take
       the whole window. -->
  <header class="os-topbar" id="topbar">
    <button type="button" id="nav-toggle" class="os-btn os-btn--ghost os-btn--md os-btn--icon os-nav-toggle" aria-controls="nav" aria-expanded="false" data-i18n-attr="aria-label:nav.menu;title:nav.menu"></button>
    <a class="os-brand" href="#/home" data-i18n-attr="aria-label:nav.home">
      <img class="os-logo--light" src="assets/logo.svg" alt="" width="123" height="24">
      <img class="os-logo--dark" src="assets/logo-dark.svg" alt="" width="123" height="24">
    </a>
    <span class="os-spacer"></span>
    <div id="topbar-tools" class="os-topbar__tools"></div>
  </header>
  <nav id="nav" class="os-side" data-i18n-attr="aria-label:nav.label">
    <div id="ws-slot"></div>
    <div id="palette-slot"></div>
    <div id="start-slot" class="os-start"></div>
    <div class="os-side__links">
      <a class="os-nav__link" href="#/home" data-nav="home" data-icon="house"><span data-i18n="nav.home-link">Home</span></a>
      <a class="os-nav__link" href="#/agreements" data-nav="agreements" data-icon="os-agreements"><span data-i18n="nav.agreements">Agreements</span></a>
      <a class="os-nav__link" href="#/templates" data-nav="templates" data-icon="os-grid"><span data-i18n="nav.templates">Templates</span></a>
      <a class="os-nav__link" href="#/reports" data-nav="reports" data-icon="os-bars"><span data-i18n="nav.reports">Reports</span></a>
      <a class="os-nav__link os-nav__link--drawer" href="verify.html" data-nav="verify" data-icon="shield-check"><span data-i18n="nav.verify">Verify a PDF</span></a>
    </div>
    <!-- Saved views: the Agreements screen fills this group (WEB-17, Agreements). -->
    <div id="nav-views" class="os-side__views" role="group" data-i18n-attr="aria-label:nav.views"></div>
    <div class="os-side__foot">
      <div id="mock-banner" class="os-mock-banner os-side__demo" role="note" hidden><span data-i18n="mock.tag">Demo mode</span></div>
      <a class="os-nav__link" href="#/admin" data-nav="admin" data-icon="os-shield" id="nav-admin" hidden><span data-i18n="nav.admin">Admin</span></a>
      <div class="os-side__me" id="side-me">
        <div id="account-slot"></div>
        <div id="bell-slot"></div>
        <div id="help-slot"></div>
      </div>
    </div>
  </nav>
  <div id="nav-scrim" class="os-nav-scrim" hidden></div>
  <div class="os-content" id="content">
    <!-- A screen that filters by text (it sets ctx.onSearch) gets this row: Agreements. -->
    <form class="os-screensearch" role="search" id="top-search-form" hidden>
      <label class="os-sr-only" for="top-search" data-i18n="agreements.search">Search agreements</label>
      <input id="top-search" class="os-input os-screensearch__input" type="search" autocomplete="off" data-i18n-attr="placeholder:top.search-placeholder">
    </form>
    <main id="main" class="os-main" tabindex="-1"></main>
  </div>
</body>
</html>
