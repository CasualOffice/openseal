<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Served at /s/{token}: every URL here is root-relative. CSP as app.html (docs/47 §As built). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="openseal-api-base" content="">
  <title>Sign · OpenSeal</title>
  <link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/sign.css">
  <script type="module" src="/sign.js"></script>
</head>
<body class="os-sign">
  <a class="os-skip" href="#main" data-i18n="a11y.skip">Skip to content</a>
  <div id="mock-banner" class="os-mock-banner" role="note" hidden><span data-i18n="mock.banner">Demo mode</span></div>
  <!-- The signer's bar (WEB-02 redesign): the document's name and progress, zoom, the
       field list, other actions, and Finish. On phones Finish and the guide move to
       the bottom bar. -->
  <header class="os-sign__bar">
    <img class="os-sign__mark" src="/assets/mark.svg" alt="OpenSeal" width="28" height="28">
    <div class="os-sign__titles">
      <p id="subject" class="os-sign__subject"></p>
      <p id="bar-progress" class="os-sign__barprogress" role="status"></p>
    </div>
    <span id="loc-chip" class="os-statuschip" role="status" hidden></span>
    <span id="save-chip" class="os-sign__savechip" role="status"></span>
    <!-- WEB-06: zoom and the page are in the document's own bar; Fields shows the field
         list panel (a bottom sheet on phones). -->
    <div id="sign-tools" class="os-sign__tools" hidden>
      <!-- G-S1: the Start/Next cue in the bar, so it is visible on arrival. -->
      <button type="button" id="bar-next" class="os-btn os-btn--tag os-btn--lg" data-testid="bar-next"><span data-i18n="sign.start">Start</span></button>
      <button type="button" id="fields-btn" class="os-btn os-btn--secondary os-btn--lg" data-i18n-attr="title:sign.fields.open"><span data-i18n="sign.fields.button">Fields</span></button>
    </div>
    <span id="finish-reason" class="os-sr-only"></span>
    <div class="os-menu-wrap">
      <button type="button" id="more-btn" class="os-btn os-btn--ghost os-btn--lg" aria-haspopup="menu" aria-expanded="false" aria-controls="more-menu" hidden></button>
      <div id="more-menu" class="os-menu os-menu--end" role="menu" data-i18n-attr="aria-label:sign.more" hidden></div>
    </div>
    <button type="button" id="bar-finish" class="os-btn os-btn--primary os-btn--lg os-sign__barfinish" aria-disabled="true" hidden><span data-i18n="sign.finish">Finish</span></button>
  </header>
  <main id="main" class="os-sign__main" tabindex="-1"></main>
  <footer id="guide" class="os-sign__guide" hidden>
    <p id="guide-progress" class="os-sign__progress" role="status"></p>
    <button type="button" id="guide-next" class="os-btn os-btn--secondary os-btn--lg"><span data-i18n="sign.start">Start</span></button>
    <button type="button" id="guide-finish" class="os-btn os-btn--primary os-btn--lg" aria-disabled="true"><span data-i18n="sign.finish">Finish</span></button>
  </footer>
</body>
</html>
