  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- docs/47 §As built: CSP, plus 'wasm-unsafe-eval' on this page only: the verifier is
       casual-sign-verify compiled to WebAssembly, and a browser compiles WebAssembly only
       when the policy allows it. No JavaScript eval is allowed. -->

  <meta name="referrer" content="no-referrer">

  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">

</head>
