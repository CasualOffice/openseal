[package]
name = "casual-sign-secrets"
version = "0.0.1"
description = "OpenSeal host secrets: a value from NAME or the file NAME_FILE names, never both (copied from OpenCalc's casual-calc-secrets)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Wipes a secret's bytes when it is dropped (RustCrypto, Apache-2.0 OR MIT; already in
# the graph through aws-lc-rs and rustls).
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }
# The digest of a daemon's security configuration (`integrity`, ASVS-24). RustCrypto,
# MIT OR Apache-2.0; the 0.11 generation the engine crates already use (ADR-006).
sha2 = { version = "0.11.1", default-features = false }

[lints]
workspace = true
