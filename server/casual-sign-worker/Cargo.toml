[package]
name = "casual-sign-worker"
version = "0.0.0"
description = "OpenSeal worker: runs the workflow's effects as idempotent jobs from the PostgreSQL queue (email, timers, sealing, webhooks, token revocation, alerts, purge) and feeds their results back through the engine (stage 2D, docs/24 §1)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
casual-sign-audit = { path = "../../crates/casual-sign-audit" }
casual-sign-model = { path = "../../crates/casual-sign-model" }
# The engine whose effects this runs and to which it feeds results (ADR-011).
casual-sign-workflow = { path = "../../crates/casual-sign-workflow" }
# fill → flatten → certificate → seal → verify (docs/30 §1).
casual-sign-sdk = { path = "../../crates/casual-sign-sdk" }
# The queue, the engine state, the audit chain and the blobs (ADR-012, ADR-013).
casual-sign-store = { path = "../casual-sign-store" }
# `RemoteKey` (the platform key over mTLS) and, in development only, `FileKey` (docs/31 §5).
casual-sign-keyd = { path = "../casual-sign-keyd" }
# The SMTP password and webhook signing secrets: `NAME` or `NAME_FILE`, redacted `Debug`.
casual-sign-secrets = { path = "../casual-sign-secrets" }
# The runtime the store already uses; the seal (blocking keyd and TSA calls) runs on its
# blocking pool. MIT.
tokio = { version = "1.40", default-features = false, features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
# Ids, times and JSON as the store takes them; all already in the tree.
uuid = { version = "1.10", features = ["v4", "serde"] }
time = { version = "0.3.36", features = ["formatting"] }
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.120"
# SMTP (docs/40, `SEC-M02`) over rustls on aws-lc-rs with the platform's roots. MIT.
# Without the `builder` feature: it pulls `quoted_printable` (0BSD, not in deny.toml), so
# messages are written by `email::Message`, every header value either checked against a
# strict grammar or RFC 2047-encoded, the body base64 (no injection path).
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "tokio1-rustls", "rustls-native-certs", "aws-lc-rs"] }
# Webhook delivery and RFC 3161 time-stamping over HTTPS: the HTTP stack the store and
# the CLI already use (rustls on aws-lc-rs, platform roots), with an SSRF-checking
# resolver (`SEC-W01`). Used in place of docs/19's `reqwest`, which is not in the tree.
ureq = { version = "3.5.1", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-native-certs = "0.8.5"
rustls-pki-types = { version = "1.15.1", features = ["std"] }
# HMAC-SHA256 for Standard Webhooks signatures, randomness for tokens, lease tokens,
# nonces and jitter (ADR-006: hosts use aws-lc-rs). Already in the tree.
aws-lc-rs = "1.19.0"
# Standard Webhooks' base64 and the email body's transfer encoding. Already in the tree.
base64 = "0.22.1"
# Certificates for the RFC 3161 and revocation sources' URLs (as the CLI). Already in
# the tree through -crypto.
x509-cert = { version = "0.3.0", default-features = false }
# The sealing certificate's DER for its fingerprint (ADR-006's der-0.8 generation).
der = { version = "0.8.3", default-features = false, features = ["alloc"] }

[dev-dependencies]
tokio = { version = "1.40", default-features = false, features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
# The store's test harness (tests/common, included by path) mints v7 ids.
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
# casual-sign-seal's throwaway PKI, key and in-process TSA (tests/common), and keyd's
# (tests/common), included by path, as the SDK's tests do.
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "crypto", "pem"] }
cms = { version = "=0.3.0-rc.2", default-features = false }
der = { version = "0.8.3", default-features = false, features = ["alloc", "derive", "oid"] }
x509-ocsp = { version = "=0.3.0-rc.1", default-features = false }
x509-tsp = { version = "=0.2.0-rc.0", default-features = false }
rust_decimal = { version = "1.37", default-features = false, features = ["std"] }
casual-sign-seal = { path = "../../crates/casual-sign-seal" }
casual-sign-verify = { path = "../../crates/casual-sign-verify" }
casual-sign-crypto = { path = "../../crates/casual-sign-crypto" }

[lints]
workspace = true
