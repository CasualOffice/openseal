[package]
name = "casual-sign-csc"
version = "0.1.0"
description = "OpenSeal remote-provider signatures: the operator's provider catalogue, provider secrets sealed AES-256-GCM, and the Cloud Signature Consortium API v2 client (RSP-01, ADR-046)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Secrets by reference: NAME or the file NAME_FILE names (the operator's client
# secrets, OPENSEAL_PROVIDER_SECRETS_KEY).
casual-sign-secrets = { path = "../casual-sign-secrets" }
# The catalogue file and the CSC wire format. Already in the tree.
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.120"
# AES-256-GCM for an account's own client secret and a session's PKCE verifier and
# code, SHA-256, randomness (ADR-006: hosts use aws-lc-rs). Already in the tree.
aws-lc-rs = "1.19.0"
# The key's encoding, CSC's base64 hashes and certificates, PKCE's base64url. Already
# in the tree.
base64 = "0.22.1"

[lints]
workspace = true
