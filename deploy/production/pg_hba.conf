# OpenSeal production profile (HRD-06): every network connection is TLS with a SCRAM
# password; there is no `host` (plain) line, so an unencrypted connection is refused.
# Local socket connections (the health check, the image's first-start scripts) also need
# the password, except the health check, which does not log in.
# TYPE   DATABASE  USER  ADDRESS     METHOD
local    all       all               scram-sha-256
hostssl  all       all   0.0.0.0/0   scram-sha-256
hostssl  all       all   ::/0        scram-sha-256
