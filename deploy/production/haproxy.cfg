# The proxy in front of the two server replicas (HRD-11, docs/65 §Production deployment).
#
# Your edge proxy (TLS, HSTS) forwards to this one's port on the host's loopback address;
# this one spreads requests over `server` and `server-2`, so either can be restarted
# (a token key or object store credential rotation, an upgrade) without an outage:
#
# - Each replica is checked every second at GET /readyz on its ops listener (port 9090,
#   OPENSEAL_OPS_LISTEN, never published). A replica told to stop (SIGINT) answers 503
#   there for OPENSEAL_DRAIN_SECONDS while still serving what reaches it, so it is taken
#   out of rotation before it stops taking connections; one whose database does not
#   answer is taken out too.
# - One request per connection to a replica (`http-server-close`): no idle connection to
#   a stopping replica is ever reused.
# - A request whose connection a replica refused never reached it, so it is sent to the
#   other (`retries`, `redispatch`), whatever its method. Nothing that reached a replica
#   is retried here: a request is never sent twice.
#
# No request is logged: signing links carry bearer tokens in their paths (docs/65 §Logs).
# Only replica state changes are, to standard output.

global
    log stdout format raw local0 notice
    maxconn 4096

defaults
    mode http
    timeout connect 5s
    timeout client 300s
    timeout server 300s
    timeout http-request 30s
    timeout queue 30s
    option http-server-close
    retries 3
    option redispatch 1

resolvers docker
    parse-resolv-conf
    # A restarted replica may come back with a new address.
    hold valid 2s

frontend openseal
    bind :8080
    no log
    default_backend servers

# The proxy's own health check (Compose), on its loopback address only.
frontend health
    bind 127.0.0.1:8405
    no log
    monitor-uri /healthz

backend servers
    log global
    balance roundrobin
    option httpchk
    http-check send meth GET uri /readyz ver HTTP/1.1 hdr Host localhost
    http-check expect status 204
    default-server inter 1s fall 2 rise 2 resolvers docker init-addr last,libc,none
    server server server:8080 check port 9090
    server server-2 server-2:8080 check port 9090
