[workspace]
resolver = "3"
# Layer division: docs/19-WORKSPACE-SCAFFOLD-DESIGN.md. A crate joins when it has a
# first consumer, so this list grows with the phases. Hosts under server/ may depend on
# crates/; nothing under crates/ may depend on them (tools/check-crate-deps.py).
members = [
    "crates/casual-sign-model",
    "crates/casual-sign-pdf",
    "crates/casual-sign-crypto",
    "crates/casual-sign-fields",
    "crates/casual-sign-pii",
    "crates/casual-sign-verify",
    "crates/casual-sign-flatten",
    "crates/casual-sign-seal",
    "crates/casual-sign-audit",
    "crates/casual-sign-certificate",
    "crates/casual-sign-sdk",
    "crates/casual-sign-cli",
    "crates/casual-sign-wasm",
    "crates/casual-sign-workflow",
    "crates/casual-sign-xfa",
    "server/casual-sign-store",
    "server/casual-sign-policy",
    "server/casual-sign-platform-store",
    "server/casual-sign-console",
    "server/casual-sign-secrets",
    "server/casual-sign-seclog",
    "server/casual-sign-keyd-client",
    "server/casual-sign-keyd",
    "server/casual-sign-modeld",
    "server/casual-sign-host",
    "server/casual-sign-worker",
    "server/casual-sign-server",
    "server/clipper2-rust",
]
# The fuzz workspace is separate: cargo-fuzz needs nightly-only dependencies that must
# stay out of the product dependency graph (as OpenCalc and OpenPresent).
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/CasualOffice/openseal"
rust-version = "1.95.0"

# Copied from OpenPresent's Cargo.toml (docs/19 §Provenance).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# Untrusted input never panics (CLAUDE.md): these make the slips a reviewer misses loud.
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
panic = "warn"

# `oar-ocr-core` (modeld's OCR, ML-02) depends on `clipper2-rust`, which is BSL-1.0: owner
# instruction 32 allows that licence only inside the ONNX Runtime binary. Our own
# Apache-2.0 crate of the same name stands in for it (server/clipper2-rust, ML-02C).
[patch.crates-io]
clipper2-rust = { path = "server/clipper2-rust" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
# Arithmetic here runs on numbers from an untrusted file; inherited from the sisters.
overflow-checks = true
