# cargo-fuzz workspace (F-007): one target per entry point that takes bytes. Kept out of
# the product workspace (root Cargo.toml `exclude`) because libfuzzer-sys needs nightly.
#
#   cargo +nightly fuzz run admit -- -max_total_time=600 -dict=fuzz/pdf.dict
#   cargo +nightly fuzz run normalize -- -max_total_time=300 -dict=fuzz/pdf.dict
#   cargo +nightly fuzz run content -- -max_total_time=120 -dict=fuzz/pdf.dict
#   cargo +nightly fuzz run verify_chain fuzz/seeds/verify_chain -- -max_total_time=300 -dict=fuzz/json.dict
#   cargo +nightly fuzz run seal fixtures/sealed fixtures/signed -- -max_total_time=300 -dict=fuzz/pdf.dict
[package]
name = "casual-sign-pdf-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
casual-sign-pdf = { path = "../crates/casual-sign-pdf" }
casual-sign-verify = { path = "../crates/casual-sign-verify" }
casual-sign-audit = { path = "../crates/casual-sign-audit" }
casual-sign-seal = { path = "../crates/casual-sign-seal" }
casual-sign-crypto = { path = "../crates/casual-sign-crypto" }
der = { version = "0.8.3", default-features = false, features = ["alloc"] }
# A throwaway signing key made at start (never written), for the `seal` target.
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "crypto"] }

[[bin]]
name = "admit"
path = "fuzz_targets/admit.rs"
test = false
doc = false
bench = false

[[bin]]
name = "normalize"
path = "fuzz_targets/normalize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "verify"
path = "fuzz_targets/verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "verify_chain"
path = "fuzz_targets/verify_chain.rs"
test = false
doc = false
bench = false

[[bin]]
name = "seal"
path = "fuzz_targets/seal.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[[bin]]
name = "content"
path = "fuzz_targets/content.rs"
test = false
doc = false
bench = false
