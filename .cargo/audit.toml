# cargo-audit configuration (docs/15). Each ignore names its reason and tracker row.
[advisories]
ignore = [
    # RUSTSEC-2026-0459 (libsqlite3-sys < 0.39): sqlx 0.9's `macros` feature (ADR-014,
    # compile-time checked queries) lists sqlx-sqlite in Cargo.lock, and sqlx-sqlite 0.9.0
    # caps libsqlite3-sys below 0.38. Nothing compiles it: `cargo tree --workspace
    # --all-features -e all -i libsqlite3-sys` prints nothing. Owner instruction 15;
    # removed under DEP-04 once sqlx allows the fixed version.
    "RUSTSEC-2026-0459",
    # RUSTSEC-2023-0089 (atomic-polyfill, unmaintained; no vulnerability): casual-sign-pii's
    # `phonenumber` (ADR-029, docs/33 §5.4) depends on postcard, which pulls heapless 0.7
    # and, only for targets without native atomics, atomic-polyfill. No target we build
    # compiles it: `cargo tree --workspace --all-features -i atomic-polyfill` prints
    # nothing; only `--target all` shows the chain. Owner instruction 32; removed under
    # DEP-05 once phonenumber drops postcard or heapless 0.7.
    "RUSTSEC-2023-0089",
    # RUSTSEC-2026-0367, -0368, -0369, -0429 (zip < 9.0.0; all four in
    # `ZipArchive::extract` / `ZipStreamReader::extract`): `oar-ocr` 0.10.2 (modeld's
    # `server` feature, ML-02) requires `zip ^8.6`, so 9.0 cannot be taken until it moves.
    # Its only zip use is `ZipArchive::new` and `by_name` in `indra/lm.rs` (an n-gram
    # model it reads from a file), never `extract`, and modeld does not load that model.
    # Pending owner confirmation, as instructions 15 and 32; removed under DEP-06.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0429",
    # RUSTSEC-2024-0436 (paste, unmaintained; no vulnerability) and RUSTSEC-2026-0192
    # (ttf-parser, unmaintained; no vulnerability): both reach modeld only because
    # `oar-ocr-core` depends on `imageproc` with its defaults, which turn on `image`'s
    # default codecs (paste is a compile-time proc macro of the avif encoder `rav1e`) and
    # `ab_glyph` text drawing (ttf-parser). modeld decodes no image file and draws no
    # text. Pending owner confirmation; removed under DEP-07, which trims those features.
    "RUSTSEC-2024-0436",
    "RUSTSEC-2026-0192",
]
