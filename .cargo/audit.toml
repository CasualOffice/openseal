# cargo-audit configuration (docs/15). Each ignore names its reason and tracker row.
[advisories]
ignore = [
    # RUSTSEC-2026-0459 (libsqlite3-sys < 0.39): sqlx 0.9's `macros` feature (ADR-014,
    # compile-time checked queries) lists sqlx-sqlite in Cargo.lock, and sqlx-sqlite 0.9.0
    # caps libsqlite3-sys below 0.38. Nothing compiles it: `cargo tree --workspace
    # --all-features -e all -i libsqlite3-sys` prints nothing. Owner instruction 15;
    # removed under DEP-04 once sqlx allows the fixed version.
    "RUSTSEC-2026-0459",
    # RUSTSEC-2024-0436 (paste, unmaintained; no vulnerability): a compile-time proc macro
    # that `tokenizers` 0.23.2, the latest release, depends on unconditionally; modeld
    # uses tokenizers for GLiNER (docs/33 §5.3) and `oar-ocr-core` for its own models.
    # Its other path, `image`'s avif encoder `rav1e`, left the lockfile when DEP-07
    # vendored `oar-ocr` and `oar-ocr-core` without `image`/`imageproc` defaults. Pending
    # owner confirmation; removed under DEP-07 once tokenizers drops paste.
    "RUSTSEC-2024-0436",
    # RUSTSEC-2026-0192 (ttf-parser, unmaintained; no vulnerability): `docxide-pdf`
    # 0.21.4, the DOCX converter ADR-042 chose (owner instruction 76), reads font metrics
    # through it. It runs only in convertd's per-job child, in a container with no network
    # and no secrets, under address-space, CPU and time caps. Removed under DEP-09 once
    # docxide-pdf moves to `skrifa` (which its `subsetter` already uses).
    "RUSTSEC-2026-0192",
]
