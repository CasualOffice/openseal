      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OtpVerifyRequest'}
      responses:
        '200':
          description: Passed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CeremonyView'}
