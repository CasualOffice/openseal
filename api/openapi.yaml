        default: {$ref: '#/components/responses/Problem'}
  /s/{token}/fields/{field}:
    parameters:
      - name: token
        in: path
        required: true
        description: Ceremony link token (secret)
        schema: {type: string}
      - name: field
        in: path
        required: true
        description: Field id
