  /api/v1/envelopes/{id}/certificate:
    parameters:
      - name: id
        in: path
        required: true
        description: Object id (UUIDv7)
        schema: {type: string}
    get:
      operationId: getCertificate
      summary: "Certificate of completion PDF (made by the seal job)"
      x-permission: "envelopes:read"
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema: {type: string, format: binary}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/envelopes/{id}/attachments/{sha256}:
    parameters:
      - {name: id, in: path, required: true, description: Object id (UUIDv7), schema: {type: string}}
      - {name: sha256, in: path, required: true, description: "The attachment's SHA-256, 64 lower-case hex digits (an attachment field's value)", schema: {type: string, pattern: '^[0-9a-f]{64}$'}}
    get:
      operationId: getAttachment
      summary: "A signer's attachment (WEB-08), recorded as attachment.downloaded"
      description: >-
        The file an attachment field's value names, checked against its hash, served as an
        attachment of the type its leading bytes show (PDF, PNG or JPEG). Recorded in the
        chain as `attachment.downloaded` with the field and the hash. Any other hash is
        `404`.
      x-permission: "envelopes:read"
      responses:
        '200':
          description: The file
          content:
            application/pdf:
              schema: {type: string, format: binary}
            image/png:
              schema: {type: string, format: binary}
            image/jpeg:
              schema: {type: string, format: binary}
        default: {$ref: '#/components/responses/Problem'}
