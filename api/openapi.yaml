    parameters:
      - name: token
        in: path
        required: true
        description: Ceremony link token (secret)
        schema: {type: string}
    post:
      operationId: ceremonyAuthenticate
      summary: "Access code"
      security: []
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthenticateRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CeremonyView'}
        default: {$ref: '#/components/responses/Problem'}
  /s/{token}/otp:
    parameters:
      - name: token
        in: path
        required: true
        description: Ceremony link token (secret)
        schema: {type: string}
    post:
      operationId: ceremonyOtpSend
      summary: "Email a one-time code"
      description: >-
        Emails the recipient a 6-digit code (SEC-A02) when the sender required `email_otp`.
        The worker draws the code and stores only its Argon2id hash; it works once, for 10
        minutes, and asking again replaces it. Limited per link and per address (3 a
        minute) and per recipient (30 seconds apart, 5 an hour): `CS-API-0003` with
        `Retry-After`. `CS-API-0014` when the recipient does not require it;
        `CS-API-0009` once it has passed.
      security: []
      x-permission: public
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '202':
          description: Accepted; the code is on its way
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CeremonyView'}
        default: {$ref: '#/components/responses/Problem'}
  /s/{token}/otp/verify:
    parameters:
      - name: token
        in: path
        required: true
        description: Ceremony link token (secret)
        schema: {type: string}
    post:
      operationId: ceremonyOtpVerify
      summary: "Check an emailed one-time code"
      description: >-
        `200` with the view when the code matches the open, unexpired code (which is then
        spent); `403` with the view otherwise (wrong, expired, replaced or already used),
        recorded as a failed attempt. The account's `max_auth_attempts` failures lock the
        recipient and revoke the link (`CS-AUTH-0004`, then `CS-AUTH-0002`); five wrong
        tries spend a code.
      security: []
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OtpVerifyRequest'}
      responses:
        '200':
          description: Passed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CeremonyView'}
        '403':
          description: Not passed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CeremonyView'}
        default: {$ref: '#/components/responses/Problem'}
  /s/{token}/documents/{doc}/content:
    parameters:
      - name: token
        in: path
        required: true
        description: Ceremony link token (secret)
        schema: {type: string}
      - name: doc
        in: path
        required: true
        description: Document id
        schema: {type: string}
    get:
      operationId: ceremonyDocument
      summary: "The document as delivered"
      description: >-
        Only in the browser the link is bound to, once the recipient has passed every
        authentication they need and, when the account requires a disclosure, consented
        to it (403 CS-AUTH-0003, CS-AUTH-0004 or CS-AUTH-0005 before; SEC-CER-01).
