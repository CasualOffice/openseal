      responses:
        '204': {description: Done}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/contacts:
    get:
      operationId: listContacts
      summary: "Past recipients for autocomplete: one per email address, most recently used first (WEB-06)"
      description: >-
        From the envelopes the caller may see (their own without `view_all`), never another
        account's. `q` matches the name or email, ignoring case; `limit` is 1 to 50 (default 10).
      x-permission: "envelopes:read"
      parameters:
        - name: q
          in: query
          required: false
          description: Text the name or email contains (ignoring case); at most 200 characters, no control characters.
          schema: {type: string, maxLength: 200}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 50, default: 10}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContactList'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/envelopes:
    get:
      operationId: listEnvelopes
      summary: "Envelopes, sorted and filtered, cursor-paginated (WEB-08)"
      description: >-
        The envelopes the caller may see (their own without `view_all`), never another
        account's, and never those removed from the lists (`DELETE` of an envelope that
        ended without completing). Newest first by default. Keyset paging: a cursor
        belongs to the sort and order it was issued for (another is `422`), and pages stay
        stable under inserts.
      x-permission: "envelopes:read"
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - name: status
          in: query
          required: false
          description: One status, or several separated by commas (any of them).
          schema: {type: string, example: "sent,delivered"}
        - $ref: '#/components/parameters/search'
        - name: sort
          in: query
          required: false
          description: >-
            `created_at` (default), `updated_at` (last change: the last command that
            changed the envelope; downloads are not changes), `expires_at` (never
            expiring after every date), `subject` (ignoring case) or `status` (lifecycle
            order: draft, sent, delivered, completing, completed, declined, voided,
            expired). Ties are broken by id.
          schema: {type: string, enum: [created_at, updated_at, expires_at, subject, status], default: created_at}
        - name: order
          in: query
          required: false
          description: Default `desc` for the times, `asc` for subject and status.
          schema: {type: string, enum: [asc, desc]}
        - name: sender
          in: query
          required: false
          description: >-
            A sender's user id, or `me`. Without `view_all` another sender's id answers an
            empty page.
          schema: {type: string}
        - name: from
          in: query
          required: false
          description: Last change at or after this instant (RFC 3339).
          schema: {type: string, format: date-time}
        - name: to
          in: query
          required: false
          description: Last change before this instant (RFC 3339).
          schema: {type: string, format: date-time}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnvelopePage'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createEnvelope
      summary: "Create a draft, or create and send in one call"
      x-permission: "envelopes:write"
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnvelopeCreate'}
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/envelopes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Object id (UUIDv7)
        schema: {type: string}
    get:
      operationId: getEnvelope
      summary: "An envelope with its documents, recipients and fields"
      x-permission: "envelopes:read"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: patchEnvelope
      summary: "Change a draft's or a correction's settings (If-Match required)"
      x-permission: "envelopes:write"
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnvelopePatch'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteEnvelope
      summary: "Delete a draft, or remove an envelope that ended without completing from the lists (If-Match required)"
      description: >-
        A draft is deleted (`envelope.purged`, policy `draft_deleted`). A declined, voided
        or expired envelope is removed from the lists only (WEB-08): `envelope.deleted` is
        recorded; its documents, audit chain and evidence stay and it can still be read by
        id. A completed envelope, or one in flight, is `409`.
      x-permission: "envelopes:write"
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      responses:
        '204': {description: Done}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/envelopes/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        description: Object id (UUIDv7)
        schema: {type: string}
    get:
      operationId: getEnvelopeStatus
      summary: "Envelope and recipient statuses"
      x-permission: "envelopes:read"
      responses:
        '200':
          description: OK
          content:
