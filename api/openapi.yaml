        '200':
          description: The ceremony view
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CeremonyView'}
        default: {$ref: '#/components/responses/Problem'}
  /s/{token}/fields/{field}:
    parameters:
      - name: token
        in: path
        required: true
        description: Ceremony link token (secret)
        schema: {type: string}
      - name: field
        in: path
        required: true
        description: Field id
        schema: {type: string}
    put:
      operationId: ceremonyFill
      summary: "Set a field's value"
      security: []
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FillRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CeremonyView'}
        default: {$ref: '#/components/responses/Problem'}
  /s/{token}/fields/{field}/attachment:
    parameters:
      - {name: token, in: path, required: true, description: Ceremony link token (secret), schema: {type: string}}
      - {name: field, in: path, required: true, description: The recipient's attachment field, schema: {type: string}}
    put:
      operationId: ceremonyAttach
      summary: "Attach a file (PDF, PNG or JPEG, at most 10 MiB) to an attachment field (WEB-06)"
      description: >-
        A PDF is admitted by the bounded reader (nothing in it run or followed); images by
        their signature. Stored write-once; the field's value is `{"attachment": "<sha256 hex>"}`,
        which the chain's `recipient.field_completed` binds and the certificate of completion
        lists. The sealed document is not changed by it. An attachment value can be given
        to `/fields/{field}` or `/finish` only as uploaded here.
      security: []
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_base64]
              additionalProperties: false
              properties:
                content_base64: {type: string}
      responses:
        '200':
          description: The ceremony view
          content:
            application/json:
              schema: {type: object}
        default: {$ref: '#/components/responses/Problem'}
  /s/{token}/finish:
    parameters:
      - name: token
        in: path
        required: true
        description: Ceremony link token (secret)
        schema: {type: string}
    post:
      operationId: ceremonyFinish
      summary: "Sign or complete"
      security: []
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FinishRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CeremonyView'}
        default: {$ref: '#/components/responses/Problem'}
  /s/{token}/paper:
    parameters:
      - name: token
        in: path
        required: true
        description: Ceremony link token (secret)
        schema: {type: string}
    post:
      operationId: ceremonySignOnPaper
      summary: "Sign on paper: upload the scan of the documents signed by hand (FG-013, ADR-043)"
      description: >-
        On an envelope whose `signing_options.allow_sign_on_paper` is on, a signer whose turn
        it is, authenticated and consented, uploads the scan of the documents they printed
        and signed by hand (a PDF, at most the document size limit). It is screened,
        admitted and normalized like any upload and added to the envelope as a fixed
        document named "Signed on paper.pdf", so the seal covers it; the chain records
        `document.added`, `document.admitted`, `document.fixed`, then
        `recipient.signed_on_paper {recipient_id, documents, document_id, upload_hash}` and
        `recipient.completed`. Off is `409 CS-WF-0012`; not a signer, not their turn or
        already finished `409`; not a PDF `422`.
      security: []
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content_base64]
              properties:
                content_base64: {type: string, description: 'The scan, a PDF, base64'}
                location: {$ref: '#/components/schemas/LocationRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CeremonyView'}
        default: {$ref: '#/components/responses/Problem'}
  /s/{token}/recipients:
    parameters:
      - name: token
        in: path
        required: true
        description: Ceremony link token (secret)
        schema: {type: string}
    post:
      operationId: ceremonyNameRecipients
      summary: "Name later recipients (agent, intermediary, editor; VS-02)"
      description: >-
        An agent supplies the name and email of recipients later in the routing order who
        have not been reached yet (the view's `later_recipients`), then finishes with
        `POST /s/{token}/finish`. An intermediary or editor may call it too. Any other
        recipient type is refused (`409`); a recipient of the caller's own order or
        earlier, or one already reached, is refused by the workflow (`403`). An
        intermediary or editor may also set `phone`, `auth` and an `access_code` (VS-06A;
        the code stored as Argon2id, never answered). The change is
        recorded as `envelope.corrected` with the recipient as actor. At most 100
        recipients per call.
      security: []
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NameRecipientsRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CeremonyView'}
        default: {$ref: '#/components/responses/Problem'}
  /s/{token}/approve:
    parameters:
      - name: token
        in: path
        required: true
        description: Ceremony link token (secret)
        schema: {type: string}
    post:
      operationId: ceremonyApprove
      summary: "Approve"
      security: []
      x-permission: public
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LocationRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CeremonyView'}
        default: {$ref: '#/components/responses/Problem'}
  /s/{token}/decline:
