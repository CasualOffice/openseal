      security: []
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeclineRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CeremonyView'}
        default: {$ref: '#/components/responses/Problem'}
  /s/{token}/withdraw-consent:
    parameters:
      - name: token
        in: path
        required: true
        description: Ceremony link token (secret)
        schema: {type: string}
    post:
      operationId: ceremonyWithdrawConsent
      summary: "Withdraw consent to electronic records (declines a required action)"
      security: []
