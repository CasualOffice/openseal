    parameters:
      - {name: id, in: path, required: true, description: Object id (UUIDv7), schema: {type: string}}
      - {name: doc, in: path, required: true, description: Document id, schema: {type: string}}
    post:
      operationId: requestAnalysis
      summary: "Ask for a draft's document to be analysed (docs/33 §6, WEB-19)"
      description: >-
        Idempotent on the job key (account, document, its SHA-256, the features, the model
        bundle). `403 CS-ML-0011` with no feature in effect; `409 CS-WF-0001` once the
        envelope is no longer a draft. The envelope's sender or an administrator.
      x-permission: "envelopes:write"
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Analysis'}
        default: {$ref: '#/components/responses/Problem'}
    get:
      operationId: getAnalysis
      summary: "The document's newest analysis"
      x-permission: "envelopes:read"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Analysis'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/envelopes/{id}/suggestions:
    parameters:
      - {name: id, in: path, required: true, description: Object id (UUIDv7), schema: {type: string}}
    get:
      operationId: listSuggestions
      summary: "Suggestions of the envelope's analyses (docs/33 §6, WEB-19)"
      description: >-
        Only kinds whose feature is in effect, only for documents still in the envelope.
        `403 CS-ML-0011` with no feature in effect.
      x-permission: "envelopes:read"
      parameters:
        - {name: kind, in: query, schema: {type: string, enum: [template, entity, personal_data]}}
        - {name: state, in: query, schema: {type: string, enum: [open, accepted, dismissed]}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
