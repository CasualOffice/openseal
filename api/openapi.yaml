        in: path
        required: true
        description: Object id (UUIDv7)
        schema: {type: string}
    post:
      operationId: createSigningView
      summary: "Five-minute embedded signing link (the creating API client only)"
      x-permission: "envelopes:send"
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SigningViewRequest'}
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SigningView'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/templates:
    get:
      operationId: listTemplates
      summary: "Templates the caller may use, by view; with deleted=true the Deleted view (UXW-02, UXW-06)"
      description: >-
        The live templates the caller may use, by name: their own, those shared with
        them (directly, through a group, or with the whole account) and, for an
        administrator, every one (UXW-06). `view` narrows the list: `owned`, `shared`
        (Shared with me: another member's templates a share reaches the caller by) or
        `favourites` (the caller's starred ones). With `deleted=true`, the deleted
        templates the caller owns (every one for an administrator), kept whole and
        restorable, most recently deleted first. Any other value is `422`.
      x-permission: "templates:read"
      parameters:
        - name: deleted
          in: query
          required: false
          description: "`true`: the Deleted view (UXW-02)."
          schema: {type: string, enum: ['true', 'false']}
        - name: view
          in: query
          required: false
          description: "`all` (default), `owned`, `shared` (Shared with me) or `favourites` (UXW-06)."
          schema: {type: string, enum: [all, owned, shared, favourites]}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TemplateList'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createTemplate
      summary: "Create a template with roles"
      x-permission: "templates:write"
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TemplateCreate'}
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Template'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/templates/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Object id (UUIDv7)
        schema: {type: string}
    get:
      operationId: getTemplate
      summary: "A template and its roles"
      x-permission: "templates:read"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Template'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: patchTemplate
      summary: "Rename a template or change its email subject and message (If-Match required)"
      x-permission: "templates:write"
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TemplatePatch'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Template'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteTemplate
      summary: "Move a live template to the Deleted view, kept whole (UXW-02); delete one already there for good, with its roles, documents and fields; envelopes made from it keep their copies (WEB-06)"
      x-permission: "templates:write"
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      responses:
        '204': {description: Done}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/templates/{id}/restore:
    parameters:
      - {name: id, in: path, required: true, description: Object id (UUIDv7), schema: {type: string}}
    post:
      operationId: restoreTemplate
      summary: "Bring a template of the Deleted view back, with everything it had (UXW-02)"
      description: >-
        `If-Match` is honoured when given. A live template, or none, is `404`. The body
        is empty or `{}`.
      x-permission: "templates:write"
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
        - {name: If-Match, in: header, required: false, description: "\"v<version>\"", schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Template'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/templates/{id}/shares:
    parameters:
      - {name: id, in: path, required: true, description: Object id (UUIDv7), schema: {type: string}}
    get:
      operationId: listTemplateShares
      summary: "Whom a template is shared with (UXW-06); its owner's or an administrator's"
      x-permission: "templates:read"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TemplateShares'}
        default: {$ref: '#/components/responses/Problem'}
    put:
      operationId: replaceTemplateShares
      summary: "Replace a template's shares with members, groups or the whole account (UXW-06)"
      description: >-
        The whole set of shares. A user is a member of this account, named by id or
        email; a group is one of its groups. Sharing with the owner, or naming one target
        twice, is `422`. A share lets its members use the template, and edit it with
        `can_edit`; deleting, restoring and sharing stay with the owner and
        administrators. Anyone without access is answered `404`, too little access `403`.
      x-permission: "templates:write"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TemplateSharesIn'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TemplateShares'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/templates/{id}/favourite:
    parameters:
      - {name: id, in: path, required: true, description: Object id (UUIDv7), schema: {type: string}}
    put:
      operationId: favouriteTemplate
      summary: "Star a template for the caller (Favourites, UXW-06); idempotent"
      x-permission: "templates:read"
      responses:
        '204': {description: Starred}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: unfavouriteTemplate
      summary: "Unstar a template for the caller (UXW-06); idempotent"
      x-permission: "templates:read"
      responses:
        '204': {description: Unstarred}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/templates/{id}/duplicate:
    parameters:
      - {name: id, in: path, required: true, description: Object id (UUIDv7), schema: {type: string}}
    post:
      operationId: duplicateTemplate
      summary: "A copy owned by the caller, with new ids, sharing the stored PDFs (WEB-06)"
      x-permission: "templates:write"
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, maxLength: 255, description: "Default `Copy of <name>`"}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Template'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/templates/{id}/documents:
    parameters:
      - {name: id, in: path, required: true, description: Object id (UUIDv7), schema: {type: string}}
    post:
      operationId: addTemplateDocument
      summary: "Add a document {name, content_base64}, admitted and normalized as an upload (WEB-06)"
      x-permission: "templates:write"
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DocumentIn'}
      responses:
        '201':
          description: The template
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Template'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/templates/{id}/documents/{doc}:
    parameters:
      - {name: id, in: path, required: true, description: Object id (UUIDv7), schema: {type: string}}
      - {name: doc, in: path, required: true, description: Template document id, schema: {type: string}}
    delete:
      operationId: deleteTemplateDocument
      summary: "Remove a document and the fields on it (WEB-06)"
      x-permission: "templates:write"
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      responses:
        '204': {description: Done}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/templates/{id}/documents/{doc}/content:
    parameters:
      - {name: id, in: path, required: true, description: Object id (UUIDv7), schema: {type: string}}
      - {name: doc, in: path, required: true, description: Template document id, schema: {type: string}}
    get:
      operationId: getTemplateDocumentContent
      summary: "The template document's normalized PDF (WEB-06)"
      x-permission: "templates:read"
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema: {type: string, format: binary}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/templates/{id}/documents/{doc}/analysis:
    parameters:
      - {name: id, in: path, required: true, description: Object id (UUIDv7), schema: {type: string}}
      - {name: doc, in: path, required: true, description: Template document id, schema: {type: string}}
    post:
      operationId: requestTemplateAnalysis
      summary: "Ask for a template document's page hashes, for matching uploads (docs/33 §6)"
      description: "`403 CS-ML-0011` unless template matching is in effect."
      x-permission: "templates:write"
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Analysis'}
        default: {$ref: '#/components/responses/Problem'}
    get:
      operationId: getTemplateAnalysis
      summary: "The template document's newest analysis"
      x-permission: "templates:read"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Analysis'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/templates/{id}/roles:
    parameters:
      - {name: id, in: path, required: true, description: Object id (UUIDv7), schema: {type: string}}
    post:
      operationId: addTemplateRole
      summary: "Add a role (WEB-06)"
      x-permission: "templates:write"
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TemplateRoleIn'}
      responses:
        '201':
          description: The template
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Template'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/templates/{id}/roles/{role}:
    parameters:
      - {name: id, in: path, required: true, description: Object id (UUIDv7), schema: {type: string}}
      - {name: role, in: path, required: true, description: Role id, schema: {type: string}}
    patch:
      operationId: patchTemplateRole
      summary: "Rename a role or change its type or routing order (WEB-06)"
      x-permission: "templates:write"
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TemplateRolePatch'}
      responses:
        '200':
          description: The template
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Template'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteTemplateRole
      summary: "Remove a role and its fields (WEB-06)"
      x-permission: "templates:write"
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      responses:
        '204': {description: Done}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/templates/{id}/fields:
    parameters:
      - {name: id, in: path, required: true, description: Object id (UUIDv7), schema: {type: string}}
    get:
      operationId: listTemplateFields
      summary: "A template's fields (WEB-06)"
      x-permission: "templates:read"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TemplateFieldList'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: addTemplateFields
      summary: "Add one field, or {items: [...]}, bound to roles (WEB-06)"
      x-permission: "templates:write"
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TemplateFieldList'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/templates/{id}/fields/{f}:
    parameters:
      - {name: id, in: path, required: true, description: Object id (UUIDv7), schema: {type: string}}
      - {name: f, in: path, required: true, description: Field id, schema: {type: string}}
    patch:
      operationId: patchTemplateField
      summary: "Change a field: the members given replace its own, null removes one (UX-11); checked whole again (WEB-06)"
      x-permission: "templates:write"
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TemplateField'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteTemplateField
      summary: "Remove a field (WEB-06)"
      x-permission: "templates:write"
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      responses:
        '204': {description: Done}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/folders:
    get:
      operationId: listFolders
      summary: "The caller's own envelope folders, by name, with counts (UXW-02)"
      x-permission: "envelopes:read"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Folder'}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createFolder
      summary: "A new folder of the caller's (at most 500)"
      x-permission: "envelopes:write"
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FolderName'}
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Folder'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/folders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: One of the caller's folders (another member's or account's is 404)
        schema: {type: string}
    patch:
      operationId: renameFolder
      summary: "Rename one of the caller's folders"
      x-permission: "envelopes:write"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FolderName'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Folder'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteFolder
      summary: "Remove one of the caller's folders; what was filed in it is in no folder"
      x-permission: "envelopes:write"
      responses:
        '204': {description: Removed}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/folders/{id}/envelopes:
    parameters:
      - name: id
        in: path
        required: true
        description: One of the caller's folders, or `none` to file the envelopes in no folder
        schema: {type: string}
    post:
      operationId: moveEnvelopes
      summary: "File 1 to 200 envelopes the caller may see in a folder of theirs, or in none, all or nothing"
      description: >-
        Filing is the caller's own view of their lists: the envelopes, their `updated_at`
        and their audit chains are untouched. An envelope the caller may not see is `404`
        and nothing moves.
      x-permission: "envelopes:write"
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FolderMove'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  moved: {type: integer}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/groups:
    get:
      operationId: listGroups
      summary: "The account's groups with member counts, for sharing templates (UXW-06)"
      x-permission: "templates:read"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupList'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createGroup
      summary: "Make a group of members (UXW-07); a name the account uses is 422 `exists` at /name"
      x-permission: "admin:users"
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GroupName'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Group'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/groups/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: A group of this account (another account's is 404)
        schema: {type: string}
    get:
      operationId: getGroup
      summary: "A group with its members' user ids"
      x-permission: "admin:users"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Group'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: renameGroup
      summary: "Rename a group"
      x-permission: "admin:users"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GroupName'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Group'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteGroup
      summary: "Delete a group; its template shares go with it"
      x-permission: "admin:users"
      responses:
        '204': {description: Deleted}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/groups/{id}/members:
    parameters:
      - name: id
        in: path
        required: true
        description: A group of this account (another account's is 404)
        schema: {type: string}
    put:
      operationId: setGroupMembers
      summary: "Make the group's members exactly these members of the account"
      description: >-
        Each id must be a member of this account (422 at `/user_ids/{i}` otherwise);
        a repeated id counts once. Each member added or removed is its own admin event.
      x-permission: "admin:users"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GroupMembers'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Group'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/permission-profiles:
    get:
      operationId: listPermissionProfiles
      summary: "The built-in profiles, then the custom ones, with what each grants and how many members hold it (UXW-07)"
      x-permission: "admin:users"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PermissionProfileList'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createPermissionProfile
      summary: "Make a custom permission profile"
      description: >-
        Its permissions are scopes of docs/40 §2 and `view_all_envelopes`; none may go
        beyond the caller's own (403 CS-AUTH-0006). A name the account uses is 422
        `exists` at /name.
      x-permission: "admin:users"
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PermissionProfileCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PermissionProfile'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/permission-profiles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: A permission profile of this account (another account's is 404)
        schema: {type: string}
    get:
      operationId: getPermissionProfile
      summary: "A permission profile"
      x-permission: "admin:users"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PermissionProfile'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updatePermissionProfile
      summary: "Change a custom profile; its members hold the new permissions from their next request"
      description: >-
        A built-in profile is 409 CS-WF-0001. The profile as it was and as it becomes
        must both be within the caller's rights (403 CS-AUTH-0006). Giving sending to
        more members is checked against the plan's seats (CS-PLAN-0003).
      x-permission: "admin:users"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PermissionProfilePatch'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PermissionProfile'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deletePermissionProfile
      summary: "Delete a custom profile no member holds (409 CS-WF-0001 for a built-in or a held one)"
      x-permission: "admin:users"
      responses:
        '204': {description: Deleted}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/webhooks:
    get:
      operationId: listWebhooks
      summary: "Webhook subscriptions"
      x-permission: "webhooks:manage"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookList'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createWebhook
      summary: "Subscribe (public HTTPS URLs only)"
      x-permission: "webhooks:manage"
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WebhookCreate'}
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Webhook'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/webhooks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Object id (UUIDv7)
        schema: {type: string}
    get:
      operationId: getWebhook
      summary: "A subscription"
      x-permission: "webhooks:manage"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Webhook'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: patchWebhook
      summary: "Edit, pause or resume a subscription (UXW-31)"
      description: >-
        `{url?, event_types?, active?}`; `active: false` pauses, `true` resumes. A new URL
        must be public HTTPS (`422 CS-API-0013`, SEC-W01).
      x-permission: "webhooks:manage"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Object'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Webhook'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteWebhook
      summary: "Disable a subscription"
      x-permission: "webhooks:manage"
      responses:
        '204': {description: Done}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/webhooks/{id}/deliveries:
    parameters:
      - name: id
        in: path
        required: true
        description: Object id (UUIDv7)
        schema: {type: string}
    get:
      operationId: listDeliveries
      summary: "A subscription's deliveries"
      x-permission: "webhooks:manage"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/webhooks/{id}/test:
    parameters:
      - name: id
        in: path
        required: true
        description: Object id (UUIDv7)
        schema: {type: string}
    post:
      operationId: testWebhook
      summary: "Send a test event through the worker (UXW-32)"
      description: >-
        Records a `webhook.test` delivery (ids only) and queues it; the worker signs and
        sends it as any delivery (SEC-W01 at connect time) and records the answer in the
        delivery log. `202` with the delivery as recorded; a paused or disabled
        subscription is `409 CS-API-0009`.
      x-permission: "webhooks:manage"
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/webhooks/{id}/deliveries/{delivery}/redeliver:
    parameters:
      - name: id
        in: path
        required: true
        description: Object id (UUIDv7)
        schema: {type: string}
      - name: delivery
        in: path
        required: true
        description: Delivery id (UUIDv7)
        schema: {type: string}
    post:
      operationId: redeliverWebhook
      summary: "Deliver one delivery's event again (UXW-33)"
      description: >-
        The same event id and payload, through the worker; the URL is checked again
        (SEC-W01). `202` with the delivery back to `pending`; a paused or disabled
        subscription is `409 CS-API-0009`.
      x-permission: "webhooks:manage"
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /s/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: Ceremony link token (secret)
        schema: {type: string}
    get:
      operationId: ceremonyView
      summary: "Recipient's view (ceremony; not public API)"
      description: "With `Accept: text/html` and not `application/json` (a browser opening the link), the web app's signing page, which checks nothing and records nothing; otherwise the view as JSON."
      security: []
      x-permission: public
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CeremonyView'}
            text/html:
              schema: {type: string}
        default: {$ref: '#/components/responses/Problem'}
  /s/{token}/session:
    parameters:
      - name: token
        in: path
        required: true
        description: Ceremony link token (secret)
        schema: {type: string}
    post:
      operationId: ceremonySession
      summary: "Bind the link to this browser and record the opening"
      security: []
      x-permission: public
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LocationRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CeremonyView'}
        default: {$ref: '#/components/responses/Problem'}
  /s/{token}/consent:
    parameters:
      - name: token
        in: path
        required: true
        description: Ceremony link token (secret)
        schema: {type: string}
    post:
      operationId: ceremonyConsent
      summary: "Accept the electronic record disclosure"
      security: []
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConsentRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CeremonyView'}
        default: {$ref: '#/components/responses/Problem'}
  /s/{token}/authenticate:
    parameters:
      - name: token
        in: path
        required: true
        description: Ceremony link token (secret)
        schema: {type: string}
    post:
      operationId: ceremonyAuthenticate
      summary: "Access code"
      security: []
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthenticateRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CeremonyView'}
        default: {$ref: '#/components/responses/Problem'}
  /s/{token}/otp:
    parameters:
      - name: token
        in: path
        required: true
        description: Ceremony link token (secret)
        schema: {type: string}
    post:
      operationId: ceremonyOtpSend
      summary: "Send a one-time code"
      description: >-
        Sends the recipient a 6-digit code (SEC-A02) for `method`: by email (`email_otp`,
        the default), by SMS (`sms_otp`) or read aloud in a voice call (`voice_otp`) to
        the recipient's phone (slice 5), when the sender required that method. The
        worker draws the code and stores only its Argon2id hash; it works once, for 10
        minutes, and asking again (by any method) replaces it. Limited per link and per
        address or phone number (3 a minute) and per recipient (30 seconds apart, 5 an
        hour): `CS-API-0003` with `Retry-After`. `CS-API-0014` when the recipient does
        not require that method; `CS-API-0009` once it has passed. Without an SMS and
        voice provider on the worker such a code is never sent (`CS-WRK-0013`).
      security: []
      x-permission: public
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OtpSendRequest'}
      responses:
        '202':
          description: Accepted; the code is on its way
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CeremonyView'}
        default: {$ref: '#/components/responses/Problem'}
  /s/{token}/otp/verify:
    parameters:
      - name: token
        in: path
        required: true
        description: Ceremony link token (secret)
        schema: {type: string}
    post:
      operationId: ceremonyOtpVerify
      summary: "Check a one-time code"
      description: >-
        `200` with the view when the code matches the open, unexpired code, whichever
        method sent it (the code is then spent and that method passed); a `method` other
        than the open code's fails; `403` with the view otherwise (wrong, expired, replaced or already used),
        recorded as a failed attempt. The account's `max_auth_attempts` failures lock the
        recipient and revoke the link (`CS-AUTH-0004`, then `CS-AUTH-0002`); five wrong
        tries spend a code.
      security: []
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OtpVerifyRequest'}
      responses:
        '200':
          description: Passed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CeremonyView'}
        '403':
          description: Not passed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CeremonyView'}
        default: {$ref: '#/components/responses/Problem'}
  /s/{token}/sso:
    parameters:
      - name: token
        in: path
        required: true
        description: Ceremony link token (secret)
        schema: {type: string}
    post:
      operationId: ceremonySsoStart
      summary: "Start signing in through an identity provider"
      description: >-
        For a recipient whose sender required `sso` (slice 5, RAUTH-01): opens a sign-in
        at one of the operator's OpenID Connect providers (listed in the view's
        `sso_providers`) and answers the view with `sso_authorization_url`, the
        provider's authorization endpoint with `state`, `nonce` and a PKCE S256
        challenge. The server keeps the nonce and verifier, and `state` only as a hash;
        a newer sign-in replaces an open one, and each works for 10 minutes. Records
        `recipient.auth_challenged` (`sso`). `CS-API-0014` when `sso` is not required or
        the server has no provider; `422` for a provider it does not list; `CS-API-0009`
        once `sso` has passed; `CS-API-0003` past 5 a minute per link.
      security: []
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SsoStartRequest'}
      responses:
        '200':
          description: Started; send the browser to `sso_authorization_url`
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CeremonyView'}
        default: {$ref: '#/components/responses/Problem'}
  /s/{token}/sso/verify:
    parameters:
      - name: token
        in: path
        required: true
        description: Ceremony link token (secret)
        schema: {type: string}
    post:
      operationId: ceremonySsoVerify
      summary: "Finish signing in through an identity provider"
      description: >-
        Takes the `state` and `code` the provider sent the browser back with (to the
        redirect URI, `/s/oidc` by default). The sign-in for that `state` closes whatever
        happens, so a replay fails. The code is exchanged with the PKCE verifier, and the
        ID token must be signed by a key in the provider's JWKS with an asymmetric
        algorithm, name the provider as issuer and the server's client as audience, be
        unexpired, carry the sign-in's nonce, and assert a verified email equal to the
        recipient's. `200` with the view on a pass, recorded as `recipient.auth_passed`
        (`sso`) with the issuer and the SHA-256 of the subject; `403` with the view
        otherwise, recorded as a failed attempt and counted to the account's
        `max_auth_attempts`. `502 CS-API-0016` when the provider cannot be reached; that
        counts nothing.
      security: []
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SsoVerifyRequest'}
      responses:
        '200':
          description: Passed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CeremonyView'}
        '403':
          description: Not passed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CeremonyView'}
        default: {$ref: '#/components/responses/Problem'}
  /s/{token}/documents/{doc}/content:
    parameters:
      - name: token
        in: path
        required: true
        description: Ceremony link token (secret)
        schema: {type: string}
      - name: doc
        in: path
        required: true
        description: Document id
        schema: {type: string}
    get:
      operationId: ceremonyDocument
      summary: "The document as delivered"
      description: >-
        Only in the browser the link is bound to, once the recipient has passed every
        authentication they need and, when the account requires a disclosure, consented
        to it (403 CS-AUTH-0003, CS-AUTH-0004 or CS-AUTH-0005 before; SEC-CER-01).
      security: []
      x-permission: public
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema: {type: string, format: binary}
        default: {$ref: '#/components/responses/Problem'}
  /s/{token}/document:
    parameters:
      - name: token
        in: path
        required: true
        description: Ceremony link token (secret)
        schema: {type: string}
    get:
      operationId: ceremonyDownload
      summary: "After finishing: the sealed document once complete, else a preview of the values so far (WEB-06)"
      description: >-
        Only for a recipient who has finished (`409 CS-API-0009` before), in the browser the
        link is bound to, while the link is valid. `doc` may be left out when the envelope has
        one document. Recorded as `document.downloaded`; `X-OpenSeal-Document` says `sealed`
        or `preview`.
      security: []
      x-permission: public
      parameters:
        - name: doc
          in: query
          required: false
          description: Document id
          schema: {type: string}
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema: {type: string, format: binary}
        default: {$ref: '#/components/responses/Problem'}
  /s/{token}/certificate:
    parameters:
      - name: token
        in: path
        required: true
        description: Ceremony link token (secret)
        schema: {type: string}
    get:
      operationId: ceremonyCertificate
      summary: "After completion: the certificate of completion, the same sealed PDF the sender downloads (VS-01)"
      description: >-
        Only for a recipient who has finished, once the envelope is `completed` (`409
        CS-API-0009` before), in the browser the link is bound to, while the link is valid
        (the completion email's link is a fresh one). Recorded as `certificate.downloaded`.
      security: []
      x-permission: public
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema: {type: string, format: binary}
        default: {$ref: '#/components/responses/Problem'}
  /s/{token}/documents/{doc}/viewed:
    parameters:
      - name: token
        in: path
