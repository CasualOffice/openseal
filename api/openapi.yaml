      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/envelopes/{id}/resend:
    parameters:
      - name: id
        in: path
