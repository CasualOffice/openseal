      operationId: deleteDocument
      summary: "Remove a document (If-Match required)"
      x-permission: "envelopes:write"
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      responses:
        '204': {description: Done}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/envelopes/{id}/documents/{doc}/content:
    parameters:
      - name: id
        in: path
        required: true
        description: Object id (UUIDv7)
        schema: {type: string}
      - name: doc
        in: path
        required: true
        description: Document id
        schema: {type: string}
    get:
      operationId: getDocumentContent
      summary: "Document bytes: original, normalized or sealed"
      x-permission: "envelopes:read"
      parameters:
        - $ref: '#/components/parameters/version'
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema: {type: string, format: binary}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/envelopes/{id}/documents/{doc}/detect-fields:
    parameters:
      - name: id
        in: path
        required: true
        description: Object id (UUIDv7)
        schema: {type: string}
      - name: doc
        in: path
        required: true
        description: Document id
        schema: {type: string}
    post:
      operationId: detectFields
      summary: "Suggested fields from the document's lines, boxes, labels and form fields (WEB-06)"
      description: >-
        Nothing is changed or recorded. Each suggestion is in the field endpoints' geometry
        (displayed page space, points, origin top-left, ADR-019); add one by posting it to
        `/fields` with a `recipient_id`. At most 500, ordered by page, top, left; `truncated`
        says a bound was reached.
      x-permission: "envelopes:write"
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DetectedFields'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/envelopes/{id}/documents/{doc}/analysis:
    parameters:
      - {name: id, in: path, required: true, description: Object id (UUIDv7), schema: {type: string}}
      - {name: doc, in: path, required: true, description: Document id, schema: {type: string}}
    post:
      operationId: requestAnalysis
      summary: "Ask for a draft's document to be analysed (docs/33 §6, WEB-19)"
      description: >-
        Idempotent on the job key (account, document, its SHA-256, the features, the model
        bundle). `403 CS-ML-0011` with no feature in effect; `409 CS-WF-0001` once the
        envelope is no longer a draft. The envelope's sender or an administrator.
      x-permission: "envelopes:write"
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Analysis'}
        default: {$ref: '#/components/responses/Problem'}
    get:
      operationId: getAnalysis
      summary: "The document's newest analysis"
      x-permission: "envelopes:read"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Analysis'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/envelopes/{id}/suggestions:
    parameters:
      - {name: id, in: path, required: true, description: Object id (UUIDv7), schema: {type: string}}
    get:
      operationId: listSuggestions
      summary: "Suggestions of the envelope's analyses (docs/33 §6, WEB-19)"
      description: >-
        Only kinds whose feature is in effect, only for documents still in the envelope.
        `403 CS-ML-0011` with no feature in effect.
      x-permission: "envelopes:read"
      parameters:
        - {name: kind, in: query, schema: {type: string, enum: [template, entity, personal_data]}}
        - {name: state, in: query, schema: {type: string, enum: [open, accepted, dismissed]}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuggestionPage'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/envelopes/{id}/suggestions/{s}/accept:
    parameters:
      - {name: id, in: path, required: true, description: Object id (UUIDv7), schema: {type: string}}
      - {name: s, in: path, required: true, description: Suggestion id, schema: {type: string}}
    post:
      operationId: acceptSuggestion
      summary: "Accept a suggestion"
      description: >-
        Records who accepted it and when. The action it suggests (applying a template, adding
        a field) is the person's own, through the ordinary endpoints. `409 CS-ML-0012` when
        already decided or its document left the envelope.
      x-permission: "envelopes:write"
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Suggestion'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/envelopes/{id}/suggestions/{s}/dismiss:
    parameters:
      - {name: id, in: path, required: true, description: Object id (UUIDv7), schema: {type: string}}
      - {name: s, in: path, required: true, description: Suggestion id, schema: {type: string}}
    post:
      operationId: dismissSuggestion
      summary: "Dismiss a suggestion"
      x-permission: "envelopes:write"
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Suggestion'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/envelopes/{id}/recipients:
    parameters:
      - name: id
        in: path
        required: true
        description: Object id (UUIDv7)
        schema: {type: string}
