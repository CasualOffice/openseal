# OpenSeal public API, version 1 (docs/40). The contract: the server's route table
# (server/casual-sign-server/src/routes.rs) and this document are kept equal by the
# contract tests (server/casual-sign-server/tests/contract.rs), operation by operation,
# with each operation's `x-permission` (the scope it needs, SEC-A05).
openapi: 3.1.0
info:
  title: OpenSeal API
  version: 1.0.0-alpha
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    Envelope-centric REST API (docs/40). Errors are RFC 9457 problem details with a
    stable `code` (docs/20) and a `request_id`. Every POST accepts `Idempotency-Key`;
    replays within 24 hours return the first response. Envelopes carry an `ETag`
    (`"v<version>"`); edits of drafts and corrections need `If-Match`. Lists page with
    `cursor` and `limit`. Times are RFC 3339 UTC; ids are UUIDv7. Objects of another
    account answer exactly as missing ones: `404 CS-API-0002`.
    The `/s/{token}` endpoints are the recipient ceremony, not public API (docs/40 §6).
servers:
  - url: /
security:
  - bearer: []
  - session: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: A personal API key (`osk_…`) or an access token from `/api/v1/oauth/token` (ES256 JWT, one hour).
    session:
      type: apiKey
      in: cookie
      name: os_session
      description: Staff session from `/api/v1/auth/login`; changing requests also send `X-CSRF-Token`.
  parameters:
    ifMatch:
      name: If-Match
      in: header
      required: true
      description: The envelope's `ETag` as read (`"v<version>"`); a stale one is `412 CS-WF-0002`, none is `428 CS-API-0008`.
      schema: {type: string}
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Up to 255 printable ASCII characters; a replay within 24 hours returns the first response.
      schema: {type: string, maxLength: 255}
    cursor:
      name: cursor
      in: query
      required: false
      schema: {type: string}
    limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    status:
      name: status
      in: query
      required: false
      schema: {$ref: '#/components/schemas/EnvelopeStatus'}
    search:
      name: q
      in: query
      required: false
      description: Text the subject, or a recipient's name or email, contains (ignoring case); at most 200 characters, no control characters.
      schema: {type: string, maxLength: 200}
    version:
      name: version
      in: query
      required: false
      description: "`current` (WEB-06): the sealed version once sealed, else a preview of the values completed so far with a not-signed banner on every page, made on request and never stored; the `X-OpenSeal-Document` header says `sealed` or `preview`."
      schema: {type: string, enum: [original, normalized, sealed, current], default: normalized}
    recipientId:
      name: recipient_id
      in: query
      required: false
      schema: {type: string}
    documentId:
      name: document_id
      in: query
      required: false
      schema: {type: string}
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        code: {type: string, pattern: '^CS-[A-Z]+-[0-9]{4}$'}
        detail: {type: string}
        request_id: {type: string}
        errors:
          type: array
          items:
            type: object
            properties:
              pointer: {type: string}
              code: {type: string}
        meter:
          type: string
          description: The plan meter that refused (`CS-PLAN-0002` to `CS-PLAN-0004`; docs/23 §7.3).
        limit: {type: integer, format: int64, minimum: 0}
        used: {type: integer, format: int64, minimum: 0}
        period_end:
          type: string
          format: date-time
          description: When the refusing quota's period ends; absent for gauges and standing quotas.
    Object:
      type: object
      additionalProperties: true
    EnvelopeStatus:
      type: string
      enum: [draft, sent, delivered, completing, completed, declined, voided, expired]
    RecipientType:
      type: string
      enum: [signer, in_person_signer, approver, viewer, cc, editor, intermediary, agent, witness, seal, notary]
    AuthMethod:
      type: string
      enum: [email_link, access_code, sms_otp, voice_otp, kba, id_verification, sso, account_login, host_asserted, email_otp]
    DeviceLocation:
      description: The browser's Geolocation fix, or a decline (row GEO-01).
      oneOf:
        - type: object
          required: [latitude, longitude, accuracy_m]
          properties:
            latitude: {type: number, minimum: -90, maximum: 90}
            longitude: {type: number, minimum: -180, maximum: 180}
            accuracy_m: {type: number, minimum: 0}
        - type: object
          required: [declined]
          properties:
            declined: {type: boolean}
    SigningOptions:
      type: object
      additionalProperties: false
      properties:
        allow_reassign: {type: boolean, default: true}
        allow_decline: {type: boolean, default: true}
        allow_finish_later: {type: boolean, default: true}
        capture_location:
          type: boolean
          default: false
          description: >-
            Record where each recipient was on every recipient action (row GEO-01, docs/32 §2):
            the device's location when the signer agrees, else an approximation from the
            request's IP address with the reason. Absent when off.
    LocationRequest:
      type: object
      additionalProperties: false
      properties:
        location: {$ref: '#/components/schemas/DeviceLocation'}
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: {type: string}
        password: {type: string}
        account_id: {type: string}
    LoginResponse:
      type: object
      properties:
        account_id: {type: string}
        user_id: {type: string}
        csrf_token: {type: string}
        expires_at: {type: string, format: date-time}
    SessionInfo:
      type: object
      properties:
        account_id: {type: string}
        user_id: {type: string}
        credential: {type: string, enum: [session, api_key, access_token]}
        client_id: {type: [string, 'null']}
        scopes: {type: array, items: {type: string}}
        admin: {type: boolean}
    MyWorkspaces:
      type: object
      properties:
        current: {type: string}
        organizations:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              name: {type: string}
              workspaces:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: string}
                    name: {type: string}
                    status: {type: string, enum: [active, archived]}
                    current: {type: boolean}
    SwitchRequest:
      type: object
      required: [account_id]
      additionalProperties: false
      properties:
        account_id: {type: string}
    TokenRequest:
      type: object
      required: [grant_type]
      description: Also accepted as application/x-www-form-urlencoded; client authentication by HTTP Basic or in the body.
      properties:
        grant_type: {type: string, const: client_credentials}
        client_id: {type: string}
        client_secret: {type: string}
        scope: {type: string}
    TokenResponse:
      type: object
      properties:
        access_token: {type: string}
        token_type: {type: string, const: Bearer}
        expires_in: {type: integer}
        scope: {type: string}
    Jwks:
      type: object
      properties:
        keys: {type: array, items: {type: object}}
    Account:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        settings: {type: object}
        data_region: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
    AccountPatch:
      type: object
      required: [settings]
      additionalProperties: false
      properties:
        settings: {type: object, description: 'Merged; `null` removes a key. `workflow_policy` must be a valid policy.'}
    User:
      type: object
      properties:
        id: {type: string}
        email: {type: string}
        name: {type: string}
        login_kind: {type: string}
        permission_profile_id: {type: string}
        disabled: {type: boolean, description: Disabled in this account}
        invitation:
          type: [string, 'null']
          enum: [pending, sent, expired, accepted, revoked, null]
          description: The latest invitation's state (single-user reads and invites only; WEB-06)
    UserList:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/User'}}
    AdminEvent:
      type: object
      required: [seq, at, action, hash, prev, event]
      properties:
        seq: {type: integer, minimum: 0}
        at: {type: string, format: date-time}
        action: {type: string, description: "`workspace.settings_changed`, `member.added`, `member.profile_changed`, `member.disabled`, `member.enabled`, `member.removed`, `member.renamed`, `member.password_set`, `profile.created`, ..."}
        hash: {type: string, description: "SHA-256 of the canonical bytes, hex"}
        prev: {type: [string, 'null'], description: "The previous event's hash, hex; null for the first"}
        event: {type: object, description: "The canonical event: v, account, seq, prev, at (ms), actor, action, target, changes (key, old, new; secrets as \"rotated\"), request_id, ip"}
    AdminEventList:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AdminEvent'}}
        next_cursor: {type: [integer, 'null']}
    Organization:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        status: {type: string, enum: [active, suspended, closed]}
        role: {type: string, enum: [owner, admin, delegated], description: "The caller's role (GET only)"}
        created_at: {type: string, format: date-time}
    OrganizationPatch:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
    OrgWorkspace:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        status: {type: string, enum: [active, archived]}
    OrgWorkspaceList:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/OrgWorkspace'}}
    OrgWorkspaceCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
    OrgWorkspaceJoin:
      type: object
      required: [profile]
      additionalProperties: false
      properties:
        profile: {type: string, description: '`admin`, `sender`, `viewer`, or a permission profile id of that workspace'}
    OrgWorkspaceMembership:
      type: object
      properties:
        workspace_id: {type: string}
        user_id: {type: string}
        permission_profile_id: {type: string}
    OrgAdmin:
      type: object
      properties:
        user_id: {type: string}
        role: {type: string, enum: [owner, admin, delegated]}
        permission_set_id: {type: [string, 'null']}
        workspace_scope: {type: [array, 'null'], items: {type: string}}
        created_at: {type: string, format: date-time}
    OrgAdminList:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/OrgAdmin'}}
    OrgAdminCreate:
      type: object
      required: [user_id, role]
      additionalProperties: false
      properties:
        user_id: {type: string, description: An enabled member of a workspace of this organization}
        role: {type: string, enum: [owner, admin], description: Delegated admins need a permission set (ORG-07)}
    OrgAdminPatch:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role: {type: string, enum: [owner, admin]}
    UserCreate:
      type: object
      required: [email, name, profile]
      additionalProperties: false
      properties:
        email: {type: string}
        name: {type: string, maxLength: 255}
        profile: {type: string, description: '`admin`, `sender`, `viewer`, or a permission profile id'}
        password: {type: string, minLength: 12, maxLength: 256}
        invite: {type: boolean, default: false, description: "Email a one-time link to set a password, valid 7 days (WEB-06); not with `password`"}
    UserPatch:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, maxLength: 255}
        password: {type: string, minLength: 12, maxLength: 256}
        profile: {type: string, description: "`admin`, `sender`, `viewer`, or a permission profile id; not your own (WEB-06)"}
        disabled: {type: boolean, description: "Disable (ending their sessions and open invitations) or enable the member in this account only; not yourself (WEB-06)"}
    AcceptInvite:
      type: object
      required: [token, password]
      additionalProperties: false
      properties:
        token: {type: string, maxLength: 128, description: The token from the invitation link}
        password: {type: string, minLength: 12, maxLength: 256}
    ApiClient:
      type: object
      properties:
        id: {type: string}
        kind: {type: string, enum: [api_key, oauth_app, jwt_integration]}
        name: {type: string}
        owner_user_id: {type: [string, 'null']}
        key_prefix: {type: [string, 'null']}
        scopes: {type: array, items: {type: string}}
        expires_at: {type: [string, 'null'], format: date-time}
        revoked: {type: boolean}
    ApiClientList:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ApiClient'}}
    ApiClientCreate:
      type: object
      required: [name, kind, scopes]
      additionalProperties: false
      properties:
        name: {type: string, maxLength: 255}
        kind: {type: string, enum: [api_key, oauth_app]}
        scopes: {type: array, items: {type: string}}
        owner_user_id: {type: string}
        expires_in_days: {type: integer, minimum: 1, maximum: 3650}
    ApiClientCreated:
      allOf:
        - $ref: '#/components/schemas/ApiClient'
        - type: object
          properties:
            key: {type: string, description: 'API key, shown once'}
            client_id: {type: string}
            client_secret: {type: string, description: 'Shown once'}
    Recipient:
      type: object
      properties:
        id: {type: string}
        type: {$ref: '#/components/schemas/RecipientType'}
        routing_order: {type: integer}
        name: {type: string}
        email: {type: string}
        status: {type: string}
        delivery: {type: string, enum: [email, sms, none]}
        auth: {type: array, items: {$ref: '#/components/schemas/AuthMethod'}}
        embedded_client_user_id: {type: [string, 'null']}
    RecipientList:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Recipient'}}
    RecipientIn:
      type: object
      required: [type, name]
      additionalProperties: false
      properties:
        ref: {type: string, description: 'Name for fields in the same request'}
        type: {$ref: '#/components/schemas/RecipientType'}
        name: {type: string, maxLength: 255}
        email: {type: string}
        phone: {type: string}
        routing_order: {type: integer, minimum: 1, maximum: 999, default: 1}
        delivery: {type: string, enum: [email, sms, none]}
        auth: {type: array, items: {$ref: '#/components/schemas/AuthMethod'}}
        access_code: {type: string, description: 'With `auth: [access_code]`; stored as Argon2id only'}
        embedded_client_user_id: {type: string}
        time_zone_offset_minutes: {type: integer}
        date_format: {type: string}
    RecipientCreate:
      oneOf:
        - $ref: '#/components/schemas/RecipientIn'
        - type: object
          required: [items]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/RecipientIn'}}
    RecipientPatch:
      type: object
      additionalProperties: false
      properties:
        name: {type: string}
        email: {type: string}
        routing_order: {type: integer}
        type:
          allOf: [{$ref: '#/components/schemas/RecipientType'}]
          description: "A new type (UX-12), on a draft only; a correction keeps the type and is refused `409`."
        auth: {type: array, items: {$ref: '#/components/schemas/AuthMethod'}}
        access_code:
          type: string
          maxLength: 255
          writeOnly: true
          description: "A new access code, stored only as Argon2id. Needed when `auth` gains `access_code`; refused when the resulting `auth` lacks it. Removing `access_code` from `auth` deletes the stored code. Draft or correcting envelopes only."
    Field:
      type: object
      description: The model's field (docs/22 §6); `placement` in displayed page points, origin top-left.
      additionalProperties: true
      properties:
        id: {type: string}
        document_id: {type: string}
        recipient_id: {type: string}
        type: {type: string}
        placement:
          type: object
          properties:
            page: {type: integer}
            x: {type: string}
            y: {type: string}
            width: {type: string}
            height: {type: string}
    FieldIn:
      type: object
      description: 'A field without ids: `recipient` (id or ref), `document` (id, or index in the same request), `type`, and `page`, `x`, `y`, `width`, `height` flat or as `placement`.'
      additionalProperties: true
    FieldList:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Field'}}
    FieldCreate:
      oneOf:
        - $ref: '#/components/schemas/FieldIn'
        - type: object
          required: [items]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/FieldIn'}}
    Document:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        pages: {type: integer}
        bytes: {type: integer}
        upload_sha256: {type: string}
        delivered_sha256: {type: string}
        admission_findings: {type: integer}
        fixed: {type: boolean}
    DocumentList:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Document'}}
    DocumentIn:
      type: object
      required: [name, content_base64]
      additionalProperties: false
      properties:
        name: {type: string, maxLength: 255}
        content_base64: {type: string, contentEncoding: base64, description: 'At most 50 MiB decoded (docs/21)'}
    DocumentUpload:
      description: 'JSON, or the PDF itself as `application/pdf` with `?name=`.'
      $ref: '#/components/schemas/DocumentIn'
    Envelope:
      type: object
      properties:
        id: {type: string}
        status: {$ref: '#/components/schemas/EnvelopeStatus'}
        version: {type: integer}
        sender_user_id: {type: string}
        subject: {type: string}
        message: {type: string}
        created_at: {type: string, format: date-time}
        sent_at: {type: [string, 'null'], format: date-time}
        ended_at: {type: [string, 'null'], format: date-time}
        expires_at: {type: [string, 'null'], format: date-time}
        reminders: {type: object}
        signing_options: {$ref: '#/components/schemas/SigningOptions'}
        seal_profile: {type: string, enum: [pades-b-t, pades-b-lt, pades-b-lta]}
        documents: {type: array, items: {$ref: '#/components/schemas/Document'}}
        recipients: {type: array, items: {$ref: '#/components/schemas/Recipient'}}
        fields: {type: array, items: {$ref: '#/components/schemas/Field'}}
    EnvelopeSummary:
      type: object
      properties:
        id: {type: string}
        status: {$ref: '#/components/schemas/EnvelopeStatus'}
        subject: {type: string}
        sender_user_id: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time, description: "Last change (WEB-08)"}
        sent_at: {type: [string, 'null'], format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}
        expires_at: {type: [string, 'null'], format: date-time}
        folder_id: {type: [string, 'null'], description: "The caller's own folder it is filed in (UXW-02)"}
        my_recipient_id: {type: [string, 'null'], description: "With waiting_for=me only: the recipient the caller is (UXW-01)"}
    Folder:
      type: object
      properties:
        id: {type: string}
        name: {type: string, maxLength: 100}
        count: {type: integer, description: "Envelopes the owner filed in it that are not deleted"}
    FolderName:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 100, description: "Trimmed; unique among the caller's folders ignoring case (422 `exists` at /name)"}
    FolderMove:
      type: object
      additionalProperties: false
      required: [envelope_ids]
      properties:
        envelope_ids: {type: array, minItems: 1, maxItems: 200, items: {type: string}}
    DetectedField:
      type: object
      properties:
        document_id: {type: string}
        type: {type: string, description: "signature, initials, date_signed, name, title, company or text; any field type for an AcroForm field"}
        page: {type: integer, minimum: 1}
        x: {type: string, description: Decimal points}
        y: {type: string}
        width: {type: string}
        height: {type: string}
        source: {type: string, enum: [underline, label, box, acroform]}
        cue: {type: string, description: "The text cue (at most 64 characters), or the form field's data label"}
        confidence: {type: integer, minimum: 0, maximum: 100}
    MlSettings:
      type: object
      description: >-
        A workspace's document-analysis switches (docs/33 §6, §7). A feature is in effect only
        when the model service is installed, the plan entitles it and an administrator turned
        it on; every level is off by default.
      properties:
        ocr: {type: boolean}
        template_matching: {type: boolean}
        extraction: {type: boolean}
        personal_data: {type: boolean}
        personal_data_model: {type: [string, 'null'], pattern: '^[A-Za-z0-9._-]{1,64}$'}
        ocr_scripts: {type: array, maxItems: 16, items: {type: string, enum: [latin, cyrillic, greek, cjk, arabic, devanagari]}}
        reread_scanner_text: {type: boolean}
        not_in_plan: {type: array, readOnly: true, items: {type: string, enum: [ocr, template_matching, extraction, personal_data]}}
        installed: {type: boolean, readOnly: true, description: false when this server has no model service}
    ErsdPublish:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: {type: string, minLength: 1, maxLength: 100000, description: "The disclosure recipients read and consent to; at most 100,000 bytes of UTF-8, not blank, no NUL"}
        language: {type: string, pattern: '^[A-Za-z][A-Za-z0-9-]{1,34}$', default: en}
    ErsdVersion:
      type: object
      description: A published disclosure, without its text.
      properties:
        id: {type: string}
        version: {type: integer, minimum: 1}
        label: {type: string, description: "The version as the policy and consent name it"}
        language: {type: string}
        sha256: {type: string, description: "`sha256:<hex>` of the text's UTF-8"}
        published_at: {type: string, format: date-time}
    ErsdVersions:
      type: object
      properties:
        current:
          type: [object, 'null']
          properties:
            label: {type: string}
            sha256: {type: string}
            version: {type: [integer, 'null']}
            language: {type: [string, 'null']}
            published_at: {type: [string, 'null'], format: date-time}
            text: {type: [string, 'null']}
        items: {type: array, items: {$ref: '#/components/schemas/ErsdVersion'}}
    MlSettingsPatch:
      type: object
      additionalProperties: false
      properties:
        ocr: {type: boolean}
        template_matching: {type: boolean}
        extraction: {type: boolean}
        personal_data: {type: boolean}
        personal_data_model: {type: [string, 'null'], pattern: '^[A-Za-z0-9._-]{1,64}$'}
        ocr_scripts: {type: array, maxItems: 16, items: {type: string, enum: [latin, cyrillic, greek, cjk, arabic, devanagari]}}
        reread_scanner_text: {type: boolean}
    Analysis:
      type: object
      description: One analysis of one stored document (docs/33 §2). Advisory; never evidence.
      properties:
        id: {type: string}
        document_id: {type: string}
        status: {type: string, enum: [queued, running, done, failed, unavailable]}
        uses: {type: array, items: {type: string, enum: [ocr, template, entities, personal_data]}}
        ocr_pages: {type: array, description: 1-based pages read by OCR, items: {type: integer, minimum: 1}}
        truncated: {type: boolean}
        bundle_id: {type: [string, 'null']}
        code: {type: string, description: Why it failed (CS-ML-*)}
        created_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
    Suggestion:
      type: object
      description: >-
        What an analysis suggests; a person accepts or dismisses it (docs/33 §6). `value` is
        read from the stored document when listed and is document content.
      properties:
        id: {type: string}
        kind: {type: string, enum: [template, entity, personal_data]}
        document_id: {type: string}
        page: {type: [integer, 'null'], minimum: 1}
        rect: {type: [object, 'null']}
        label: {type: string}
        value: {type: [string, 'null']}
        normalized: {type: [string, 'null']}
        score: {type: number, minimum: 0, maximum: 1}
        model:
          type: object
          properties:
            id: {type: string}
            sha256: {type: string}
        state: {type: string, enum: [open, accepted, dismissed]}
        template_id: {type: string, description: The matched template (kind template)}
        pages_matched: {type: [integer, 'null']}
        pages_total: {type: [integer, 'null']}
        decided_by: {type: string}
        decided_at: {type: string, format: date-time}
    SuggestionPage:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Suggestion'}}
        next_cursor: {type: [string, 'null']}
    DetectedFields:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/DetectedField'}}
        truncated: {type: boolean}
    Contact:
      type: object
      description: A past recipient (personal data); the name last used with this address.
      properties:
        name: {type: string}
        email: {type: string}
        last_used_at: {type: string, format: date-time}
    ContactList:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Contact'}}
    EnvelopePage:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/EnvelopeSummary'}}
        next_cursor: {type: [string, 'null']}
    EnvelopeCreate:
      type: object
      additionalProperties: false
      properties:
        subject: {type: string, maxLength: 255}
        message: {type: string, maxLength: 10000}
        status: {type: string, enum: [draft, sent], default: draft}
        documents: {type: array, items: {$ref: '#/components/schemas/DocumentIn'}}
        recipients: {type: array, items: {$ref: '#/components/schemas/RecipientIn'}}
        fields: {type: array, items: {$ref: '#/components/schemas/FieldIn'}}
        reminders:
          type: object
          properties:
            first_after_days: {type: integer, maximum: 999}
            then_every_days: {type: integer, maximum: 999}
        expires_in_days: {type: integer}
        signing_options: {$ref: '#/components/schemas/SigningOptions'}
        seal_profile: {type: string, enum: [pades-b-t, pades-b-lt, pades-b-lta]}
    EnvelopePatch:
      type: object
      additionalProperties: false
      properties:
        subject: {type: string}
        message: {type: string}
        reminders: {type: object}
        expires_in_days: {type: [integer, 'null']}
        signing_options: {$ref: '#/components/schemas/SigningOptions'}
        seal_profile: {type: string}
    EnvelopeStatusInfo:
      type: object
      properties:
        id: {type: string}
        status: {$ref: '#/components/schemas/EnvelopeStatus'}
        version: {type: integer}
        recipients: {type: array, items: {type: object}}
    VoidRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: {type: string, maxLength: 10000}
    CorrectRequest:
      type: object
      required: [changes]
      additionalProperties: false
      properties:
        changes: {type: array, items: {type: object, description: 'The engine change list (casual-sign-workflow `Change`), tagged by `op`'}}
    ResendRequest:
      type: object
      additionalProperties: false
      properties:
        recipient_ids: {type: array, items: {type: string}}
    AuditEvents:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              seq: {type: integer}
              type: {type: string}
              at: {type: string, format: date-time}
              hash: {type: string}
              prev: {type: [string, 'null']}
              event: {type: object, description: 'The event as chained (RFC 8785); its `context` holds the client address and user agent'}
        chain_head: {type: [string, 'null']}
    SigningViewRequest:
      type: object
      required: [recipient_id]
      additionalProperties: false
      properties:
        recipient_id: {type: string}
        auth_asserted: {type: string, description: "The host's statement of how it authenticated the signer"}
    SigningView:
      type: object
      properties:
        url: {type: string}
        expires_at: {type: string, format: date-time}
    Template:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        version: {type: integer}
        email_subject: {type: [string, 'null']}
        email_message: {type: [string, 'null']}
        roles: {type: array, items: {type: object}}
        documents: {type: array, items: {type: object}, description: "Single-template reads only: id, name, ord, pages, page_geometry, sha256"}
        fields: {type: array, items: {$ref: '#/components/schemas/TemplateField'}, description: Single-template reads only}
        access: {type: string, enum: [owner, edit, use], description: "What the caller may do with it (UXW-06): owner (its owner or an administrator: also delete, restore and share), edit, or use"}
        favourite: {type: boolean, description: "Starred by the caller (UXW-06)"}
        shared: {type: boolean, description: "List reads only: shared with anyone (UXW-06)"}
    TemplateList:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Template'}}
    TemplateCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string}
        email_subject: {type: string}
        email_message: {type: string}
        roles:
          type: array
          items:
            type: object
            required: [name, type]
            properties:
              name: {type: string}
              routing_order: {type: integer}
              type: {$ref: '#/components/schemas/RecipientType'}
    TemplateShares:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              can_edit: {type: boolean}
              user: {type: object, description: "A member: id, name, email"}
              group: {type: object, description: "A group: id, name"}
              account: {type: boolean, description: "The whole account"}
    TemplateSharesIn:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            description: "Exactly one of user_id, email, group_id or account: true"
            properties:
              user_id: {type: string}
              email: {type: string, minLength: 3, maxLength: 320}
              group_id: {type: string}
              account: {type: boolean, enum: [true]}
              can_edit: {type: boolean, default: false}
    GroupList:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              name: {type: string}
              members: {type: integer}
    GroupName:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
    Group:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        members: {type: integer}
        user_ids: {type: array, items: {type: string}}
    GroupMembers:
      type: object
      additionalProperties: false
      required: [user_ids]
      properties:
        user_ids: {type: array, items: {type: string}}
    PermissionName:
      type: string
      enum: [envelopes:read, envelopes:write, envelopes:send, templates:read, templates:write, bulk:send, webhooks:manage, admin:users, admin:account, audit:read, view_all_envelopes]
    PermissionProfile:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        kind: {type: string, enum: [admin, sender, viewer, custom]}
        builtin: {type: boolean}
        permissions:
          type: array
          description: What it grants, in docs/40 order; a built-in profile's come from its kind
          items: {$ref: '#/components/schemas/PermissionName'}
        members: {type: integer, description: How many members hold it}
    PermissionProfileList:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/PermissionProfile'}
    PermissionProfileCreate:
      type: object
      additionalProperties: false
      required: [name, permissions]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        permissions:
          type: array
          items: {$ref: '#/components/schemas/PermissionName'}
    PermissionProfilePatch:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        permissions:
          type: array
          items: {$ref: '#/components/schemas/PermissionName'}
    TemplatePatch:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, maxLength: 255}
        email_subject: {type: [string, 'null'], maxLength: 255}
        email_message: {type: [string, 'null'], maxLength: 10000}
    TemplateRoleIn:
      type: object
      required: [name, type]
      additionalProperties: false
      properties:
        name: {type: string, maxLength: 255}
        type: {type: string}
        routing_order: {type: integer, minimum: 1, maximum: 999, default: 1}
    TemplateRolePatch:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, maxLength: 255}
        type: {type: string}
        routing_order: {type: integer, minimum: 1, maximum: 999}
    TemplateField:
      type: object
      description: >-
        A field as on an envelope (docs/22 §6), bound to `role_id` instead of a recipient;
        input takes `role_id` (or `role`), `document_id`, and the flat `page`, `x`, `y`,
        `width`, `height` or `placement` (WEB-06).
      additionalProperties: true
    TemplateFieldList:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/TemplateField'}}
    Webhook:
      type: object
      properties:
        id: {type: string}
        envelope_id: {type: [string, 'null']}
        url: {type: string}
        event_types: {type: array, items: {type: string}}
        secret_refs: {type: array, items: {type: string}}
        active: {type: boolean}
    WebhookList:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Webhook'}}
    WebhookCreate:
      type: object
      required: [url, event_types, secret_refs]
      additionalProperties: false
      properties:
        url: {type: string, description: 'https:// to a public address (SEC-W01)'}
        event_types: {type: array, items: {type: string}}
        secret_refs: {type: array, minItems: 1, maxItems: 4, items: {type: string}}
        envelope_id: {type: string}
    CeremonyView:
      type: object
      properties:
        envelope:
          type: object
          description: '`id`, `status`, `subject`, `message`, `signing_options`, `documents`, and `expires_at` (when it expires, or null; UXW-34)'
        recipient: {$ref: '#/components/schemas/Recipient'}
        fields: {type: array, items: {$ref: '#/components/schemas/Field'}}
        capture_location: {type: boolean, description: 'Whether the page asks the device for its location (GEO-01)'}
        adoption_id: {type: string, description: 'After adopt: the capture a signature or initials field value names ({"signature": "<adoption_id>"})'}
        consent_required:
          type: [object, 'null']
          description: The account's disclosure the recipient must accept, or null when it requires none.
          properties:
            version: {type: string, description: 'The label `POST /s/{token}/consent` takes'}
            sha256: {type: string, description: '`sha256:<hex>` over the text''s UTF-8, the hash consent records'}
            url: {type: string, description: '`/s/{token}/disclosure`, present only when the account has published that text (UXW-34)'}
        auth_required: {type: [array, 'null'], items: {$ref: '#/components/schemas/AuthMethod'}}
        later_recipients:
          type: array
          description: >-
            Only for an agent, intermediary or editor who has authenticated (VS-02): the
            recipients later in the routing order not yet reached, which
            `POST /s/{token}/recipients` may name. Absent for every other recipient.
          items:
            type: object
            properties:
              id: {type: string}
              type: {type: string}
              routing_order: {type: integer}
              name: {type: string}
              email: {type: string}
        sso_providers:
          type: array
          description: 'While `sso` is still to pass (RAUTH-01): the identity providers the signer may sign in with; empty when the server has none'
          items:
            type: object
            properties:
              id: {type: string}
              name: {type: string}
        sso_authorization_url: {type: string, description: 'After `POST /s/{token}/sso`: where the page sends the browser to sign in (RAUTH-01)'}
        sender:
          type: object
          description: Who sent the envelope, so the recipient can judge whether the request is genuine (UXW-34).
          properties:
            name: {type: [string, 'null'], description: "The sending user's name as the account holds it now; null once they are no longer a member"}
            email: {type: [string, 'null'], description: "The sending user's email address; null once they are no longer a member"}
            organisation: {type: string, description: "The account's brand name (`settings.branding.name`), else the account's name"}
    NameRecipientsRequest:
      type: object
      required: [recipients]
      additionalProperties: false
      properties:
        recipients:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [id]
            additionalProperties: false
            properties:
              id: {type: string, description: 'A recipient in `later_recipients`'}
              name: {type: string, minLength: 1, maxLength: 255}
              email: {type: string, minLength: 3, maxLength: 320}
        location: {$ref: '#/components/schemas/DeviceLocation'}
    CeremonyDisclosure:
      type: object
      required: [version, sha256, text]
      properties:
        version: {type: string, description: 'The label `POST /s/{token}/consent` takes'}
        sha256: {type: string, description: '`sha256:<hex>` over the text''s UTF-8, re-checked as it is read'}
        text: {type: string}
    ConsentRequest:
      type: object
      required: [ersd_version]
      properties:
        ersd_version: {type: string}
        location: {$ref: '#/components/schemas/DeviceLocation'}
    AuthenticateRequest:
      type: object
      required: [method, code]
      properties:
        method: {$ref: '#/components/schemas/AuthMethod'}
        code: {type: string}
    OtpSendRequest:
      description: Which one-time code to send (SEC-A02); `email_otp` when absent.
      type: object
      additionalProperties: false
      properties:
        method: {type: string, enum: [email_otp, sms_otp, voice_otp]}
        location: {$ref: '#/components/schemas/DeviceLocation'}
    OtpVerifyRequest:
      description: A one-time code sent by email, SMS or voice call (SEC-A02), six digits.
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: {type: string, pattern: '^[0-9]{6}$'}
        method: {type: string, enum: [email_otp, sms_otp, voice_otp]}
    SsoStartRequest:
      description: Which of the server's identity providers to sign in with (RAUTH-01).
      type: object
      additionalProperties: false
      required: [provider]
      properties:
        provider: {type: string, pattern: '^[a-z0-9-]{1,32}$'}
    SsoVerifyRequest:
      description: What the identity provider sent the browser back with (RAUTH-01).
      type: object
      additionalProperties: false
      required: [state, code]
      properties:
        state: {type: string, maxLength: 256}
        code: {type: string, maxLength: 2048}
    ViewedRequest:
      type: object
      required: [pages_seen]
      properties:
        pages_seen: {type: array, items: {type: integer, minimum: 1}}
        location: {$ref: '#/components/schemas/DeviceLocation'}
    AdoptRequest:
      type: object
      required: [mark, method, image_base64]
      properties:
        mark: {type: string, enum: [signature, initials]}
        method: {type: string, enum: [draw, type, upload]}
        image_base64: {type: string, description: 'PNG or JPEG, at most 5 MiB'}
        location: {$ref: '#/components/schemas/DeviceLocation'}
    FieldValue:
      type: object
      description: 'Externally tagged: {"text": "…"}, {"checked": true}, {"choice": "…"}, {"signature": "<id>"}, {"attachment": "<id>"}'
    FillRequest:
      type: object
      required: [value]
      properties:
        value: {$ref: '#/components/schemas/FieldValue'}
    FinishRequest:
      type: object
      properties:
        values:
          type: array
          items:
            type: object
            required: [field, value]
            properties:
              field: {type: string}
              value: {$ref: '#/components/schemas/FieldValue'}
        location: {$ref: '#/components/schemas/DeviceLocation'}
    DeclineRequest:
      type: object
      properties:
        reason: {type: string}
        location: {$ref: '#/components/schemas/DeviceLocation'}
    ReassignRequest:
      type: object
      required: [name, email]
      additionalProperties: false
      properties:
        name: {type: string, maxLength: 255}
        email: {type: string, maxLength: 320}
        reason: {type: string, maxLength: 10000}
        location: {$ref: '#/components/schemas/DeviceLocation'}
    CeremonyHistory:
      type: object
      properties:
        events:
          type: array
          items:
            type: object
            properties:
              seq: {type: integer}
              type: {type: string, description: "The audit event type (docs/32 §3)"}
              at: {type: string, format: date-time}
              by: {type: string, enum: [you, sender, recipient, user, host, system]}

paths:
  /api/v1/auth/login:
    post:
      operationId: login
      summary: "Local password login: session cookie and CSRF token"
      security: []
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/auth/accept-invite:
    post:
      operationId: acceptInvite
      summary: "Spend a user invitation's one-time link and set the password (WEB-06)"
      description: >-
        An unknown, expired, spent or revoked link, or a member disabled meanwhile, is
        `401 CS-AUTH-0002`, all alike. Setting the password ends the member's sessions
        in every account they belong to (SEC-ID-01). The member then logs in with
        `/auth/login`. Rate-limited as login.
      security: []
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AcceptInvite'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  account_id: {type: string}
                  user_id: {type: string}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: "End the current staff session"
      x-permission: ""
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '204': {description: Done}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/auth/password-reset:
    post:
      operationId: requestPasswordReset
      summary: "Ask for a password-reset email (UXW-38)"
      description: >-
        No session. `202 {}` for any well-formed address, whether or not it has an
        account (no enumeration). For a local, enabled user the worker emails a one-time
        link that expires in an hour; only the SHA-256 of its token is stored. At most
        one email a minute per user; rate-limited as login, per address and per client.
      security: []
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: {type: string}
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: "Spend a password-reset link and set a new password (UXW-38)"
      description: >-
        An unknown, expired, spent or revoked link is `401 CS-AUTH-0002`, all alike.
        Setting the password ends the user's sessions in every account and revokes their
        other open resets. Rate-limited as login.
      security: []
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AcceptInvite'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  account_id: {type: string}
                  user_id: {type: string}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/auth/providers:
    get:
      operationId: authProviders
      summary: "SSO identity providers offered on sign-in (UXW-39)"
      description: "No session. `{items: [{id, name, url}]}`; empty until SSO is built (FG-173)."
      security: []
      x-permission: public
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/auth/workspaces:
    get:
      operationId: listMyWorkspaces
      summary: "The caller's workspaces, grouped by organization (ORG-04)"
      description: >-
        Every workspace the signed-in person holds an enabled membership in, by
        organization, with the session's own workspace marked `current`. Metadata only.
        A staff session only: an API key or access token belongs to one workspace and
        gets `422 CS-API-0001`.
      x-permission: ""
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MyWorkspaces'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/auth/switch:
    post:
      operationId: switchWorkspace
      summary: "Move the session to another workspace of the caller (ORG-04)"
      description: >-
        Ends the current session and issues a new one in `account_id`, carrying the same
        sign-in (method, time and expiry), so a switch never extends a session. The
        caller must hold an enabled membership there: otherwise, or for an id that does
        not exist, `403 CS-ORG-0001`. A staff session with its CSRF token only. The
        workspace always comes from the session; no header or parameter chooses
        another (SEC-O05).
      x-permission: ""
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SwitchRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/auth/session:
    get:
      operationId: getSession
      summary: "Who the credential is"
      x-permission: ""
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionInfo'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/oauth/token:
    post:
      operationId: token
      summary: "OAuth 2.1 client-credentials grant"
      security: []
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TokenRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        default: {$ref: '#/components/responses/Problem'}
  /.well-known/jwks.json:
    get:
      operationId: jwks
      summary: "Keys that verify access tokens"
      security: []
      x-permission: public
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Jwks'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/accounts/me:
    get:
      operationId: getAccount
      summary: "The caller's account"
      x-permission: ""
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: patchAccount
      summary: "Merge into the account's settings"
      x-permission: "admin:account"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AccountPatch'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/account/settings/ml:
    get:
      operationId: getMlSettings
      summary: "The workspace's document-analysis settings (docs/33 §6, WEB-19)"
      x-permission: "admin:account"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MlSettings'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: patchMlSettings
      summary: "Turn document-analysis features on or off"
      description: >-
        Turning on a feature the plan lacks, or any feature while the model service is not
        installed, is `403 CS-ML-0011`; turning one off is always allowed.
      x-permission: "admin:account"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MlSettingsPatch'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MlSettings'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/ersd-versions:
    get:
      operationId: listErsdVersions
      summary: "The account's electronic disclosure: the one the workflow policy names, with its text, and the published versions (ERSD-01)"
      description: >-
        `current` is the disclosure `settings.workflow_policy.ersd` names, with its published
        text (`text` null when no intact published row has that hash), or null when the
        account requires none. `items` are the published versions, newest first, at most 100,
        without their text.
      x-permission: "admin:account"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErsdVersions'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: publishErsdVersion
      summary: "Publish disclosure text as the next version and require it, in one step (ERSD-01)"
      description: >-
        Writes the next version of `language` (one more than its highest), its `ersd.published`
        admin event, and `settings.workflow_policy.ersd = {version, hash}` with its
        `workspace.settings_changed` event, in one transaction. Envelopes already sent then ask
        for consent to the new version. Published rows are never changed: a new text is a new
        version. An empty or blank text, one with a NUL, or a bad language tag is
        `422 CS-API-0001`; a text over 100,000 bytes is `413 CS-API-0006`.
      x-permission: "admin:account"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ErsdPublish'}
      responses:
        '201':
          description: Published and required
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErsdVersion'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/admin-events:
    get:
      operationId: listAdminEvents
      summary: "The workspace's admin audit log (ORG-05), oldest first, verified before it is answered"
      description: >-
        Every settings, member, profile and workspace change, hash-chained per workspace.
        Each item carries its `seq`, `hash`, `prev` and the event as its RFC 8785 canonical
        JSON; `hash` is SHA-256 of those bytes. Each page is verified as it is read: linked
        to the event at its cursor, the last page to the stored head, and each `at` to its
        bytes, so walking the log by cursor checks every link once. `verify=full` re-verifies
        the whole log first. A broken chain is `500 CS-DB-0014`. `format=csv` answers `text/csv` with columns
        `seq,at,action,hash,prev,event` and the next cursor in `X-Next-Cursor`.
      x-permission: "admin:account"
      parameters:
        - {name: cursor, in: query, required: false, description: "The `seq` after which to start", schema: {type: integer, minimum: 0}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
        - {name: format, in: query, required: false, schema: {type: string, enum: [json, csv], default: json}}
        - {name: verify, in: query, required: false, description: "`page` verifies the page read; `full` re-verifies the whole log first; another value is `422 CS-API-0001`", schema: {type: string, enum: [page, full], default: page}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminEventList'}
            text/csv:
              schema: {type: string}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/organizations/me:
    get:
      operationId: getOrganization
      summary: "The caller's organization and their role in it (ORG-03)"
      description: >-
        Organization metadata only; no role confers access to agreements (SEC-O07).
        The caller's organization is the session's workspace's; the role is read from
        `organization_admins` on every request (no role, or an action it does not hold:
        `403 CS-AUTH-0006`; a non-session credential: `403 CS-AUTH-0006`). Another
        organization's ids answer `404 CS-API-0002`.
      x-permission: ""
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Organization'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: patchOrganization
      summary: "Rename the organization (`org.settings.update`), logged as `organization.renamed`"
      x-permission: ""
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrganizationPatch'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Organization'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/organizations/me/workspaces:
    get:
      operationId: listOrgWorkspaces
      summary: "The organization's workspaces, by name (metadata only)"
      x-permission: ""
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrgWorkspaceList'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createOrgWorkspace
      summary: "Create a workspace (`org.workspaces.create`) with its built-in profiles and no member, logged as `workspace.created`"
      x-permission: ""
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrgWorkspaceCreate'}
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrgWorkspace'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/organizations/me/workspaces/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Workspace id (UUIDv7)
        schema: {type: string}
    get:
      operationId: getOrgWorkspace
      summary: "A workspace of the organization (metadata only)"
      x-permission: ""
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrgWorkspace'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/organizations/me/workspaces/{id}/archive:
    parameters:
      - name: id
        in: path
        required: true
        description: Workspace id (UUIDv7)
        schema: {type: string}
    post:
      operationId: archiveOrgWorkspace
      summary: "Archive a workspace (`org.workspaces.archive`, idempotent), logged as `workspace.archived`"
      x-permission: ""
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrgWorkspace'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/organizations/me/workspaces/{id}/join:
    parameters:
      - name: id
        in: path
        required: true
        description: Workspace id (UUIDv7)
        schema: {type: string}
    post:
      operationId: joinOrgWorkspace
      summary: "Become a member of a workspace (`org.workspaces.join`, owners and admins only)"
      description: >-
        The only way an organization role reaches agreements: one transaction writes the membership,
        `member.added` (`via: organization`) in the workspace's log and `org.workspace_joined` in the
        organization's. A delegated admin gets `403 CS-AUTH-0006`; an archived workspace `409 CS-ORG-0010`.
      x-permission: ""
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrgWorkspaceJoin'}
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrgWorkspaceMembership'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/organizations/me/admins:
    get:
      operationId: listOrgAdmins
      summary: "The organization's owners and admins"
      x-permission: ""
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrgAdminList'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: addOrgAdmin
      summary: "Make a user an owner or admin (`org.admins.manage`, owners only), logged as `organization.admin_added`"
      description: >-
        The user must be an enabled member of a workspace of this organization, else `422 CS-ORG-0018`
        (also for an id the organization cannot see); never oneself (`403 CS-ORG-0005`).
      x-permission: ""
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrgAdminCreate'}
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrgAdmin'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/organizations/me/admins/{user}:
    parameters:
      - name: user
        in: path
        required: true
        description: User id (UUIDv7)
        schema: {type: string}
    patch:
      operationId: patchOrgAdmin
      summary: "Change an administrator's role (owners only; never one's own), logged as `organization.admin_role_changed`"
      description: >-
        A delegated admin made an owner or admin loses its permission set and workspace
        scope; the same role again changes and logs nothing. Leaving no enabled owner is
        `409 CS-ORG-0008`.
      x-permission: ""
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrgAdminPatch'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrgAdmin'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: removeOrgAdmin
      summary: "Remove an administrator (owners only), logged as `organization.admin_removed`"
      description: >-
        An owner may resign; the last enabled owner may not (`409 CS-ORG-0008`).
      x-permission: ""
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object, properties: {user_id: {type: string}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/organizations/me/audit:
    get:
      operationId: listOrgAdminEvents
      summary: "The organization's admin audit log (`org.audit.read`), oldest first, verified as read"
      description: >-
        As `GET /admin-events`, over the organization's chain: workspace creation and archiving,
        joins, administrator changes, renames, and the platform's `operator.*` copies (CON-16).
      x-permission: ""
      parameters:
        - {name: cursor, in: query, required: false, description: "The `seq` after which to start", schema: {type: integer, minimum: 0}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
        - {name: format, in: query, required: false, schema: {type: string, enum: [json, csv], default: json}}
        - {name: verify, in: query, required: false, schema: {type: string, enum: [page, full], default: page}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminEventList'}
            text/csv:
              schema: {type: string}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/users/me:
    get:
      operationId: getMe
      summary: "The signed-in user's own profile (UXW-37)"
      description: >-
        `{id, name, email, notifications {completed, declined, viewed}, signature,
        initials}`; each mark is `{image_base64}` or null. Notices and marks are this
        account's.
      x-permission: ""
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Object'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: patchMe
      summary: "Change one's own profile (UXW-37)"
      description: >-
        `{name?, notifications?, signature?, initials?, password?, current_password?}`.
        A mark is `{image_base64}` (PNG or JPEG, at most 5 MiB) or null to remove it.
        The name and password are the user's in every account and change only through
        their own session (`422` with another credential). A new password needs the
        current one (`401 CS-AUTH-0007` when wrong) and ends every other session of the
        user in every account; this session stays.
      x-permission: ""
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Object'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/users:
    get:
      operationId: listUsers
      summary: "Members of the account"
      x-permission: "admin:users"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserList'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createUser
      summary: "Add a local member"
      x-permission: "admin:users"
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserCreate'}
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Object id (UUIDv7)
        schema: {type: string}
    get:
      operationId: getUser
      summary: "A member"
      x-permission: "admin:users"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: patchUser
      summary: "Rename a member, set their password, change their profile, disable or enable them"
      description: >-
        The name and password belong to the user in every account (SEC-ID-01). An
        administrator, or any API key (the user's own included), changes them only for a
        user whose one membership is this account; for a user who also belongs to another
        account it is `403 CS-API-0015` and nothing in the request is applied. The user
        changes their own name and password through their own session; a new password
        ends their sessions in every account. Profile fields and disabling apply to this
        account's membership only.
      x-permission: "admin:users"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserPatch'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteUser
      summary: "Remove a member from the account"
      x-permission: "admin:users"
      responses:
        '204': {description: Done}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/users/{id}/invite:
    parameters:
      - name: id
        in: path
        required: true
        description: Object id (UUIDv7)
        schema: {type: string}
    post:
      operationId: inviteUser
      summary: "Email the member a new one-time set-password link; earlier links stop working (WEB-06)"
      x-permission: "admin:users"
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/api-clients:
    get:
      operationId: listApiClients
      summary: "API keys and OAuth clients"
      x-permission: "admin:account"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiClientList'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createApiClient
      summary: "New API key or OAuth client; the secret is shown once"
      x-permission: "admin:account"
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApiClientCreate'}
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiClientCreated'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/api-clients/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Object id (UUIDv7)
        schema: {type: string}
    get:
      operationId: getApiClient
      summary: "An API client"
      x-permission: "admin:account"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiClient'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: revokeApiClient
      summary: "Revoke an API client"
      x-permission: "admin:account"
      responses:
        '204': {description: Done}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/contacts:
    get:
      operationId: listContacts
      summary: "Past recipients for autocomplete: one per email address, most recently used first (WEB-06)"
      description: >-
        From the envelopes the caller may see (their own without `view_all`), never another
        account's. `q` matches the name or email, ignoring case; `limit` is 1 to 50 (default 10).
      x-permission: "envelopes:read"
      parameters:
        - name: q
          in: query
          required: false
          description: Text the name or email contains (ignoring case); at most 200 characters, no control characters.
          schema: {type: string, maxLength: 200}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 50, default: 10}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContactList'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/envelopes:
    get:
      operationId: listEnvelopes
      summary: "Envelopes, sorted and filtered, cursor-paginated (WEB-08)"
      description: >-
        The envelopes the caller may see (their own without `view_all`), never another
        account's, and never those removed from the lists (`DELETE` of an envelope that
        ended without completing) unless `deleted=true` asks for exactly those (the
        Deleted view, UXW-02). `waiting_for=me` is the Inbox (UXW-01): sent envelopes of
        this account, whoever sent them, in which the caller is, by their account email, a
        recipient whose turn it is and who acts through a link (not a copy, an in-person
        or an embedded signer); each item then has `my_recipient_id`. Every item has
        `folder_id`, the caller's own folder it is filed in, or null. Newest first by
        default. Keyset paging: a cursor belongs to the sort and order it was issued for
        (another is `422`), and pages stay stable under inserts.
      x-permission: "envelopes:read"
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - name: status
          in: query
          required: false
          description: One status, or several separated by commas (any of them).
          schema: {type: string, example: "sent,delivered"}
        - $ref: '#/components/parameters/search'
        - name: sort
          in: query
          required: false
          description: >-
            `created_at` (default), `updated_at` (last change: the last command that
            changed the envelope; downloads are not changes), `expires_at` (never
            expiring after every date), `subject` (ignoring case) or `status` (lifecycle
            order: draft, sent, delivered, completing, completed, declined, voided,
            expired). Ties are broken by id.
          schema: {type: string, enum: [created_at, updated_at, expires_at, subject, status], default: created_at}
        - name: order
          in: query
          required: false
          description: Default `desc` for the times, `asc` for subject and status.
          schema: {type: string, enum: [asc, desc]}
        - name: sender
          in: query
          required: false
          description: >-
            A sender's user id, or `me`. Without `view_all` another sender's id answers an
            empty page.
          schema: {type: string}
        - name: from
          in: query
          required: false
          description: "`date_field` at or after this instant (RFC 3339)."
          schema: {type: string, format: date-time}
        - name: to
          in: query
          required: false
          description: "`date_field` before this instant (RFC 3339)."
          schema: {type: string, format: date-time}
        - name: date_field
          in: query
          required: false
          description: >-
            Which date `from` and `to` bound (UXW-03): the last change (default), creation,
            sending or completion. An envelope without that date is outside any range.
          schema: {type: string, enum: [updated_at, created_at, sent_at, completed_at], default: updated_at}
        - name: recipient
          in: query
          required: false
          description: >-
            Text a recipient's name or email contains, ignoring case (UXW-03); at most 200
            characters.
          schema: {type: string, maxLength: 200}
        - name: folder
          in: query
          required: false
          description: >-
            One of the caller's folders (another member's matches nothing), or `none`: in
            none of the caller's folders (UXW-02).
          schema: {type: string}
        - name: deleted
          in: query
          required: false
          description: "`true`: only the envelopes removed from the lists, the Deleted view (UXW-02)."
          schema: {type: string, enum: ["true", "false"], default: "false"}
        - name: waiting_for
          in: query
          required: false
          description: "`me`: the Inbox (UXW-01)."
          schema: {type: string, enum: [me]}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnvelopePage'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createEnvelope
      summary: "Create a draft, or create and send in one call"
      x-permission: "envelopes:write"
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnvelopeCreate'}
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/envelopes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Object id (UUIDv7)
        schema: {type: string}
    get:
      operationId: getEnvelope
      summary: "An envelope with its documents, recipients and fields"
      x-permission: "envelopes:read"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: patchEnvelope
      summary: "Change a draft's or a correction's settings (If-Match required)"
      x-permission: "envelopes:write"
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnvelopePatch'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteEnvelope
      summary: "Delete a draft, or remove an envelope that ended without completing from the lists (If-Match required)"
      description: >-
        A draft is deleted (`envelope.purged`, policy `draft_deleted`). A declined, voided
        or expired envelope is removed from the lists only (WEB-08): `envelope.deleted` is
        recorded; its documents, audit chain and evidence stay and it can still be read by
        id. A completed envelope, or one in flight, is `409`.
