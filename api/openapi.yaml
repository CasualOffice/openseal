  /api/v1/envelopes/{id}/transfer:
    parameters:
      - name: id
        in: path
        required: true
        description: Object id (UUIDv7)
        schema: {type: string}
    post:
      operationId: transferEnvelope
      summary: "Pass the envelope's ownership to another member of this workspace (ORG-09)"
      description: >-
        Any state but purged; records `envelope.transferred {from_user, to_user}` in the
