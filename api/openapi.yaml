        `CS-BLK-0003` a name over 255 characters or with control characters,
        `CS-BLK-0006` more values than columns. A row with a problem is stored `failed`
        and never sent. With `validate_only` nothing is stored: the answer is 200 with
        each row's check. Send the batch with `POST …/send`. Also needs `envelopes:write`
