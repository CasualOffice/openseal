          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CeremonyView'}
        default: {$ref: '#/components/responses/Problem'}
  /s/{token}/reassign:
    parameters:
      - name: token
        in: path
        required: true
        description: Ceremony link token (secret)
        schema: {type: string}
    post:
      operationId: ceremonyReassign
      summary: "Hand the part to someone else (when allow_reassign; WEB-07)"
      description: >-
        Only while the envelope's `signing_options.allow_reassign` is on and this recipient
        has a required action not yet finished (`409` otherwise). The new recipient takes
        the same routing order and fields (values cleared) and is invited when their turn
        comes; this link stops working at once; `recipient.reassigned` is recorded with
        the reason and, when the envelope captures location, where.
      security: []
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReassignRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CeremonyView'}
        default: {$ref: '#/components/responses/Problem'}
  /s/{token}/history:
    parameters:
      - name: token
        in: path
        required: true
        description: Ceremony link token (secret)
        schema: {type: string}
    get:
      operationId: ceremonyHistory
      summary: "The envelope's history as this recipient may see it (WEB-07)"
      description: >-
        Events this recipient acted in or that concern them, and the envelope's milestones
        (sent, corrected, voided, declined, expired, completing, completed) from the first
        `envelope.sent` on, so a draft's own edits never show as a correction, oldest first,
        as `{seq, type, at, by}` only: no other person's name, address, IP, user agent or
        location, and no values. Only in the bound browser, after every required
        authentication and, when the account has a disclosure, consent (`403` before).
        Records nothing.
      security: []
      x-permission: public
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CeremonyHistory'}
        default: {$ref: '#/components/responses/Problem'}
  /s/{token}/disclosure:
    parameters:
      - name: token
        in: path
        required: true
        description: Ceremony link token (secret)
        schema: {type: string}
    get:
      operationId: ceremonyDisclosure
      summary: "The full disclosure (ERSD) the view's consent_required names (UXW-34)"
      description: >-
        The account's published text for its current disclosure, found by the hash consent
        records and re-checked as it is read. `404` when the account requires no disclosure
        or has published no text for it. Only in the bound browser, after every required
        authentication (`403` before), as consent; still readable after finishing or
        declining while the link is valid. Records nothing.
      security: []
      x-permission: public
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CeremonyDisclosure'}
        default: {$ref: '#/components/responses/Problem'}
