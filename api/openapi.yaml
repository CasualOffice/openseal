              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/BulkSend'}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createBulkSend
      summary: "Check a list of recipient sets against a template, and make a bulk send of it (UXW-04)"
      description: >-
        The list is CSV text (a header, then one row per envelope) or JSON rows; its
        columns are two per template role, in role order: `<role>::name` and
        `<role>::email`, matched ignoring case and surrounding spaces. A header that does
        not fit the template is 422 (`CS-BLK-0004` missing columns at `/columns`,
