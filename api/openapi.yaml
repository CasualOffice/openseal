        schema: {type: string}
    get:
      operationId: getCertificate
      summary: "Certificate of completion PDF (made by the seal job), or a declined, voided or expired envelope's envelope certificate (UXW-30)"
      description: >-
        A completed envelope's certificate of completion. A declined, voided or expired
        envelope's envelope certificate says how it ended and never claims completion;
