        in: path
        required: true
        description: Object id (UUIDv7)
        schema: {type: string}
    get:
      operationId: getAnchorProof
      summary: "The anchor proof of the envelope's latest anchored chain head (FG-158)"
      description: >-
        The proof file (`openseal.anchor-proof` v1, canonical JSON) of the envelope's latest
