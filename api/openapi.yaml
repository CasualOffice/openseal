    parameters:
      - name: id
        in: path
        required: true
        description: Object id (UUIDv7)
        schema: {type: string}
    post:
      operationId: createSignLink
      summary: "The Inbox (UXW-01): a five-minute signing link for the signed-in member, as the recipient they are"
      description: >-
        For a member signed in with a session (an API key or OAuth client is `403`) who
        is, by their account email, a recipient of this envelope whose turn it is and
        who acts through a link. The ceremony records the member's sign-in
        (`account_login`) as how the link was obtained and applies every authentication
        the sender required. `404` when the caller neither may see the envelope nor is a
        recipient of it; `409 CS-WF-0007` when routing has not reached them or has passed.
        The body is empty or `{}`.
      x-permission: ""
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SigningView'}
        default: {$ref: '#/components/responses/Problem'}
