            application/json:
              schema: {$ref: '#/components/schemas/CeremonyView'}
        default: {$ref: '#/components/responses/Problem'}
  /s/{token}/recipients:
    parameters:
      - name: token
        in: path
        required: true
        description: Ceremony link token (secret)
        schema: {type: string}
    post:
      operationId: ceremonyNameRecipients
      summary: "Name later recipients (agent, intermediary, editor; VS-02)"
      description: >-
        An agent supplies the name and email of recipients later in the routing order who
        have not been reached yet (the view's `later_recipients`), then finishes with
        `POST /s/{token}/finish`. An intermediary or editor may call it too. Any other
        recipient type is refused (`409`); a recipient of the caller's own order or
        earlier, or one already reached, is refused by the workflow (`403`). The change is
        recorded as `envelope.corrected` with the recipient as actor. At most 100
        recipients per call.
      security: []
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NameRecipientsRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CeremonyView'}
        default: {$ref: '#/components/responses/Problem'}
  /s/{token}/approve:
    parameters:
      - name: token
        in: path
        required: true
