        `to_workspace` other than this one, or a `to_user` who is not an enabled member
        here, is `422 CS-ORG-0009`. An API key or OAuth token also needs
        `envelopes:send` granted, else `403 CS-AUTH-0006`.
      x-permission: "envelopes.transfer"
      x-level: workspace
      parameters:
        - $ref: '#/components/parameters/ifMatch'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TransferRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        default: {$ref: '#/components/responses/Problem'}
