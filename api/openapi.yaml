      x-level: workspace
      parameters:
        - name: If-Match
          in: header
          required: false
          description: The envelope's `ETag` as read; a stale one is `412 CS-WF-0002`.
          schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        default: {$ref: '#/components/responses/Problem'}
