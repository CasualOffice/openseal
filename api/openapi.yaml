    post:
      operationId: hostInPersonSigner
      summary: "Host an in-person signer: records recipient.in_person_hosted and returns a one-hour signing link that acts as the caller hosting the signer (UXW-36)"
      x-permission: "envelopes:send"
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SigningView'}
