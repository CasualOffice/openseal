            schema: {$ref: '#/components/schemas/BulkSendCreate'}
      responses:
        '200':
          description: "validate_only: each row's check; nothing stored"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BulkSendCheck'}
        '201':
          description: Made, queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BulkSendWithRows'}
