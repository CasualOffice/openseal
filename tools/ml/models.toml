# The pinned model bundle for casual-sign-modeld (ML-01, ADR-029, docs/33 §8-9).
#
# Every file modeld may load, and the ONNX Runtime library it runs them on, is listed
# here with a revision-pinned source URL, its SHA-256 and byte count, and its licence.
# tools/ml/fetch-models.py downloads the profiles asked for, refuses any mismatch or any
# licence outside deny.toml's allow list, and writes bundle.json; modeld embeds this
# file and re-hashes every listed file at start. Nothing else is ever loaded.
#
# Pinned 2026-11-12 by downloading each file once and hashing it; for the Hugging Face
# LFS files the hash also equals the hub's own LFS object id, and for ONNX Runtime the
# digest GitHub publishes for the release asset. Every revision is older than two weeks.
#
# Fields: id ([A-Za-z0-9._-], modeld's id alphabet); profile; arch (x86_64, aarch64 or
# any); role (runtime, notice, model, tokenizer, config, export-input); dest (path in
# the bundle); source_url (a Hugging Face /resolve/<commit>/ URL or a GitHub release
# asset); sha256 and bytes of the downloaded file; licence (SPDX) with licence_url and
# card_url; provenance (where it comes from, and its training data, which docs/09's
# weights register repeats: we rely on the weight licence and claim no clean lineage).
# licence_exception (optional) names a scoped owner exception that fetch-models.py
# honours only for the entry ids it lists: owner-instruction-32 lets the ONNX Runtime
# library carry Eigen's MPL-2.0 and Boost's BSL-1.0, shipped with ThirdPartyNotices.txt.
# runtime and notice entries name one archive member (extract, extract_sha256,
# extract_bytes); nothing else in the archive is written. An entry with an empty sha256
# is pending: produced_by names the offline export that will pin it, and a profile
# holding one is refused until then. An entry with a sha256 and an empty source_url is
# pinned but not hosted: produced_by made it, the hash is fixed, bytes is its size (0
# where the export did not record it), and a profile holding one is refused until
# OpenSeal's mirror serves it (ML-15). GLiNER files are the fp16 exports the golden
# parity ran on (owner instruction 34; the quint8 exports lose spans, ML-14; ML-21);
# --self-test checks their hashes against fixtures/ml/gliner-golden/. Profiles named export-* are inputs to those
# exports, never bundled. Size caps: 1 GiB per bundled file, 2 GiB per bundle.
#
# Weights in bundled profiles are ONNX only; pickle (.bin, .pt) is never bundled.
# Rejected for their licences (docs/33 §5): GLiNER v0 and v1 (CC-BY-NC-4.0),
# iiiorg/piiranha-v1 (CC-BY-NC-ND-4.0), nvidia/gliner-PII (NVIDIA Open Model License).

schema = 1

