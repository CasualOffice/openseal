# OpenSeal on one machine, for evaluation and development (T-2F, docs/65).
#
#   docker compose up -d --build --wait
#   docker compose exec -e OPENSEAL_ADMIN_PASSWORD='a long passphrase' server \
#       casual-sign-server bootstrap "Acme" admin@acme.example "Ada Admin"
#   open http://localhost:8080          # the web app; mail at http://localhost:8025
#   docker compose down -v              # stop and discard every volume (data, keys)
#
# Development only: `pki` generates a throwaway CA, keys and passwords into the `secrets`
# volume on first start (and modeld's TLS identity alone into `modeld-secrets`), `tsa` is
# a development time-stamping authority, keyd keeps the
# seal key in SoftHSM, and the server sends cookies over plain HTTP on localhost. For
# production follow docs/65 §Production checklist, and ship the logs off the box with
# deploy/compose.log-forwarding.yml (docs/65 §Logs). Every image is pinned by digest
# (docs/04 rule 31); ports bind to the loopback address only. Every long-running
# service restarts after it exits (`restart: unless-stopped`, HRD-01): the worker and
# the server recover their work from the database (docs/65 §Failure recovery).

name: openseal

x-secrets: &secrets
  type: volume
  source: secrets
  target: /secrets
  read_only: true

x-s3: &s3
  OPENSEAL_S3_ENDPOINT: http://s3:8333
  OPENSEAL_S3_BUCKET: openseal
  OPENSEAL_S3_ACCESS_KEY: openseal
  OPENSEAL_S3_SECRET_KEY_FILE: /secrets/s3-secret-key

services:
  pki:
    build: {context: ., dockerfile: deploy/devtools/Dockerfile}
    image: openseal-devtools:dev
    command: ["sh", "/usr/local/bin/dev-pki"]
    user: root
    # modeld-secrets: modeld's TLS identity only; modeld never mounts `secrets` (ML-01).
    volumes: [secrets:/secrets, modeld-secrets:/modeld-secrets]
    restart: "no"

  tsa:
    image: openseal-devtools:dev
    restart: unless-stopped
    command: ["python3", "-I", "/usr/local/bin/dev-tsa", "8318"]
    user: tsa
    volumes: [*secrets]
    depends_on: {pki: {condition: service_completed_successfully}}
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 8318), 2)"]
      interval: 3s
      retries: 20

  postgres:
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    restart: unless-stopped
    environment:
      POSTGRES_DB: openseal
      POSTGRES_PASSWORD_FILE: /secrets/postgres-password
    volumes:
      - postgres:/var/lib/postgresql/data
      - *secrets
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
    depends_on: {pki: {condition: service_completed_successfully}}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "openseal"]
      interval: 3s
      retries: 30

  s3:
    image: chrislusf/seaweedfs:latest@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
    restart: unless-stopped
    # -master.telemetry=false: SeaweedFS otherwise reports cluster statistics to its
    # vendor (found by HRD-06).
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/secrets/s3.json", "-ip.bind=0.0.0.0", "-master.telemetry=false"]
    volumes: [s3:/data, *secrets]
    depends_on: {pki: {condition: service_completed_successfully}}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/status"]
      interval: 3s
      retries: 40

  mailpit:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    restart: unless-stopped
    ports: ["127.0.0.1:${OPENSEAL_MAIL_PORT:-8025}:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      retries: 20

  keyd:
    build: {context: ., dockerfile: deploy/Dockerfile, target: keyd}
    restart: unless-stopped
    image: ${OPENSEAL_IMAGE_PREFIX:-openseal}-keyd:${OPENSEAL_VERSION:-dev}
    environment:
      OPENSEAL_KEYD_TLS_CERT: /secrets/keyd-tls-chain.pem
      OPENSEAL_KEYD_TLS_KEY: /secrets/keyd-tls.key
      OPENSEAL_KEYD_CLIENT_CA: /secrets/ca.pem
      OPENSEAL_KEYD_ALLOW_LIST: /secrets/keyd-allow-list
      OPENSEAL_KEYD_OPLOG: /var/lib/keyd/oplog
      OPENSEAL_KEYD_CHAIN: /secrets/seal-chain.pem
      OPENSEAL_KEYD_PKCS11_TOKEN: openseal
      OPENSEAL_KEYD_PKCS11_KEY_LABEL: platform
      OPENSEAL_KEYD_PKCS11_PIN_FILE: /secrets/softhsm-pin
      # Development: import the generated key into a new token on first start.
      OPENSEAL_KEYD_IMPORT_KEY: /secrets/seal.key
      OPENSEAL_KEYD_SO_PIN_FILE: /secrets/softhsm-so-pin
    volumes: [keyd:/var/lib/keyd, *secrets]
    depends_on: {pki: {condition: service_completed_successfully}}

  migrate:
    build: {context: ., dockerfile: deploy/Dockerfile, target: server}
    image: ${OPENSEAL_IMAGE_PREFIX:-openseal}-server:${OPENSEAL_VERSION:-dev}
    command: ["migrate"]
    environment:
      OPENSEAL_MIGRATE_DATABASE_URL_FILE: /secrets/migrate-database-url
    volumes: [*secrets]
    depends_on: {postgres: {condition: service_healthy}}
    restart: "no"
    healthcheck: {disable: true}

  server:
    image: ${OPENSEAL_IMAGE_PREFIX:-openseal}-server:${OPENSEAL_VERSION:-dev}
    restart: unless-stopped
    environment:
      <<: *s3
      OPENSEAL_DATABASE_URL_FILE: /secrets/database-url
      OPENSEAL_JWT_SIGNING_KEY_FILE: /secrets/jwt.key
      OPENSEAL_PUBLIC_URL: http://localhost:${OPENSEAL_HTTP_PORT:-8080}
      # Plain-HTTP cookies, for http://localhost only (the token key is the file above).
      OPENSEAL_DEV_INSECURE_KEY: "1"
      # Malware scanning (ASVS-11): `clamav:3310` with the `production` profile below;
      # empty (the default) scans nothing.
      OPENSEAL_CLAMD_ADDR: ${OPENSEAL_CLAMD_ADDR:-}
    ports: ["127.0.0.1:${OPENSEAL_HTTP_PORT:-8080}:8080"]
    volumes: [*secrets]
    depends_on:
      migrate: {condition: service_completed_successfully}
      s3: {condition: service_healthy}
      clamav: {condition: service_healthy, required: false}

  worker:
    build: {context: ., dockerfile: deploy/Dockerfile, target: worker}
    restart: unless-stopped
    image: ${OPENSEAL_IMAGE_PREFIX:-openseal}-worker:${OPENSEAL_VERSION:-dev}
    environment:
      <<: *s3
      OPENSEAL_DATABASE_URL_FILE: /secrets/database-url
      OPENSEAL_BASE_URL: http://localhost:${OPENSEAL_HTTP_PORT:-8080}
      OPENSEAL_MAIL_FROM: no-reply@openseal.localhost
      OPENSEAL_MAIL_FROM_NAME: OpenSeal (development)
      OPENSEAL_MAIL_DOMAIN: openseal.localhost
      OPENSEAL_ABUSE: abuse@openseal.localhost
      OPENSEAL_SMTP_HOST: mailpit
      OPENSEAL_SMTP_PORT: "1025"
      OPENSEAL_SMTP_SECURITY: plain
      OPENSEAL_TSA_URLS: http://tsa:8318/
      OPENSEAL_TRUST_ANCHORS: /secrets/ca.pem
      OPENSEAL_KEYD_ADDR: keyd:7443
      OPENSEAL_KEYD_SERVER_NAME: keyd
      OPENSEAL_KEYD_CA: /secrets/ca.pem
      OPENSEAL_KEYD_CLIENT_CERT: /secrets/worker-client-chain.pem
      OPENSEAL_KEYD_CLIENT_KEY: /secrets/worker-client.key
      OPENSEAL_SEAL_NAME: OpenSeal development
      OPENSEAL_SEAL_REASON: Sealed on completion (development)
    volumes: [*secrets]
    depends_on:
      server: {condition: service_healthy}
      keyd: {condition: service_healthy}
      tsa: {condition: service_healthy}
      mailpit: {condition: service_healthy}

  # Malware scanning of every upload (ASVS-11, docs/65 §Malware scanning): ClamAV's clamd
  # in its own container, reached by the server only over INSTREAM on port 3310 (never
  # published). Turn it on with
  #   OPENSEAL_CLAMD_ADDR=clamav:3310 docker compose --profile production up -d --build --wait
  # The server then refuses uploads (503 CS-SCAN-0002) while clamd cannot answer, unless
  # OPENSEAL_CLAMD_FAIL_OPEN=1. freshclam, in the same container, keeps the signatures in
  # the `clamav` volume current and needs outbound HTTPS to the ClamAV mirrors. The
  # stream limit is set explicitly to match the server's default OPENSEAL_CLAMD_MAX_BYTES.
  clamav:
    profiles: [production]
    image: clamav/clamav-debian:1.4@sha256:aedee9daad6b069b26adad61af7ec50a41efe33fd8eff7f985c1f31e3a6ae9de
    environment:
      CLAMD_CONF_StreamMaxLength: 100M
    volumes: [clamav:/var/lib/clamav]
    mem_limit: 3g
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 10s
      retries: 6
      start_period: 6m

  # Optional pretrained models (ML-01, ADR-029, docs/33): `docker compose --profile ml up`.
  # No secrets beyond its own TLS identity: it mounts its own `modeld-secrets` volume,
  # which pki fills with modeld's chain, key, ca.pem and allow list only, never the
  # shared `secrets` volume (tools/ml/check-modeld-isolation.py checks this). Only on the
  # `ml` network, which is internal (no route out). The weights are baked into the image,
  # hash-checked at build and again at start. OPENSEAL_ML_PROFILES picks the bundle
  # (docs/65 §Pretrained models); `personal_data` joins the default once OpenSeal's
  # mirror serves the GLiNER fp16 export (ML-15, ML-21).
  modeld:
    profiles: [ml]
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: modeld
      args: {OPENSEAL_ML_PROFILES: "${OPENSEAL_ML_PROFILES:-ocr templates}"}
    image: ${OPENSEAL_IMAGE_PREFIX:-openseal}-modeld:${OPENSEAL_VERSION:-dev}
    environment:
      OPENSEAL_MODELD_TLS_CERT: /secrets/modeld-tls-chain.pem
      OPENSEAL_MODELD_TLS_KEY: /secrets/modeld-tls.key
      OPENSEAL_MODELD_CLIENT_CA: /secrets/ca.pem
      OPENSEAL_MODELD_ALLOW_LIST: /secrets/modeld-allow-list
      OPENSEAL_MODELD_OPLOG: /var/lib/modeld/oplog
    volumes:
      - modeld:/var/lib/modeld
      - {type: volume, source: modeld-secrets, target: /secrets, read_only: true}
    networks: [ml]
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    mem_limit: 4g
    pids_limit: 256
    ulimits: {core: 0}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: {pki: {condition: service_completed_successfully}}

networks:
  # internal: no gateway, so nothing on it reaches the internet (docs/33 invariant 4).
  ml:
    internal: true

volumes:
  secrets:
  postgres:
  s3:
  keyd:
  modeld:
  modeld-secrets:
  clamav:
